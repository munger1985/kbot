syntax = "proto3";

package kbot_md_sys_conf;

service KbotMdSysConfService {
    rpc Create (KbotMdSysConf) returns (KbotMdSysConf);
    rpc GetById (GetByIdRequest) returns (KbotMdSysConf);
    rpc GetAll (Empty) returns (KbotMdSysConfList);
    rpc Update (KbotMdSysConf) returns (KbotMdSysConf);
    rpc Delete (DeleteRequest) returns (DeleteResponse);
}

message KbotMdSysConf {
    int32 conf_id = 1;
    // 添加其他字段...
}

message GetByIdRequest {
    int32 conf_id = 1;
}

message Empty {}

message KbotMdSysConfList {
    repeated KbotMdSysConf configs = 1;
}

message DeleteRequest {
    int32 conf_id = 1;
}

message DeleteResponse {
    bool success = 1;
}