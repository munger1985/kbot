[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbot-platform-clients"
version = "4.0.0"
description = "KBot 跨服务客户端包"
requires-python = ">=3.10"
dependencies = [
  "aiohttp==3.13.3",
  "kbot-platform-core==4.0.0",
  "Pillow==12.2.0",
  "pydantic==2.12.5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["platform_clients*"]
