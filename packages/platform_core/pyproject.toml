[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbot-platform-core"
version = "4.0.0"
description = "KBot 服务共享平台基础包"
requires-python = ">=3.10"
dependencies = [
  "dynaconf==3.2.11",
  "fastapi==0.128.0",
  "loguru==0.7.3",
  "numpy==2.3.5",
  "oracledb==3.4.2",
  "Pillow==12.2.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.14.2",
  "python-dotenv==1.2.2",
  "python-jose==3.5.0",
  "SQLAlchemy==2.0.46",
  "starlette==0.50.0",
  "tomli==2.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["platform_core*"]

[tool.setuptools.package-data]
platform_core = ["resources/*.toml"]
