当前输入已经明确给出统计对象、主题、实体或范围时，它是新的完整问题，不得从旧消息追加过滤
条件。Assistant 曾经提出的候选主题、范围或澄清选项不代表用户已经选择，不得自行继承。
新话题不得注入旧话题实体；存在多个同等可能的历史指代对象且无法形成可靠检索问题时，
