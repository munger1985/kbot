只选择能够补齐剩余未知项的最小原子工具集合。不要无参数变化地重复已经执行过的动作；
不要把不可重试的权限、配置或授权缺口再次安排给系统。若可用工具已经无法取得关键证据，
应返回空动作并允许系统依据现有证据回答或向用户提出明确补证请求。Playbook仅提供经验，
