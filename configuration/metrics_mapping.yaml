# configuration/metrics_mapping.yaml
# =============================================================================
# Oracle 指标基于 oracledb_exporter 2.4.1 实际暴露的指标，校验命令:
# curl -s http://localhost:9161/metrics | grep "^oracledb_" | awk -F'{' '{print $1}' | sort -u
#
# Zabbix 指标 Item Key 基于常见的 Zabbix 数据库监控模板命名约定,
# 实际使用时需根据用户 Zabbix 模板配置调整 Item Key。
# =============================================================================

# ---------------------------------------------------------------------------
# 可用性
# ---------------------------------------------------------------------------
db_availability:
  name: "数据库实例可用性"
  description: "检查数据库实例是否在线且可被 Prometheus Exporter 正常采集"
  tags: [availability, health, fundamental]
  required_params: [instance]
  providers:
    oracle: 'oracledb_up{{instance="{instance}"}}'
    postgresql: 'pg_up{{instance="{instance}"}}'
    mysql: 'mysql_up{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.ping[{instance}]'
    postgresql: 'pgsql.ping[{instance}]'
    mysql: 'mysql.ping[{instance}]'

# ---------------------------------------------------------------------------
# 会话与进程
# ---------------------------------------------------------------------------
db_active_sessions:
  name: "会话总数"
  description: "监控当前数据库会话总数，判断是否存在请求积压、连接风暴"
  tags: [session, performance, concurrency]
  required_params: [instance]
  providers:
    oracle: 'oracledb_sessions_value{{instance="{instance}"}}'
    postgresql: 'pg_stat_database_numbackends{{instance="{instance}"}}'
    mysql: 'mysql_global_status_threads_running{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.sessions[{instance}]'
    postgresql: 'pgsql.sessions[{instance}]'
    mysql: 'mysql.threads[{instance}]'

db_process_count:
  name: "数据库进程数"
  description: "监控数据库当前进程总数，判断是否接近 processes 参数上限"
  tags: [process, capacity, oracle]
  required_params: [instance]
  providers:
    oracle: 'oracledb_process_count{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.processes[{instance}]'

# ---------------------------------------------------------------------------
# SQL 负载
# ---------------------------------------------------------------------------
db_execute_count:
  name: "SQL执行次数"
  description: "监控SQL执行累计次数，反映数据库查询负载"
  tags: [query, throughput, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_activity_execute_count{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.executes[{instance}]'

db_parse_count:
  name: "SQL解析次数"
  description: "监控SQL解析累计次数（硬解析+软解析），突增说明未使用绑定变量或共享池压力大"
  tags: [query, parse, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_activity_parse_count_total{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.parses[{instance}]'

db_user_commits:
  name: "用户提交数"
  description: "监控用户提交事务的累计次数，反映业务写入负载量级"
  tags: [transaction, throughput, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_activity_user_commits{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.commits[{instance}]'

db_user_rollbacks:
  name: "用户回滚数"
  description: "监控用户回滚事务的累计次数，持续增长说明应用存在异常或锁冲突"
  tags: [transaction, rollback, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_activity_user_rollbacks{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.rollbacks[{instance}]'

# ---------------------------------------------------------------------------
# 缓存命中率
# ---------------------------------------------------------------------------
db_buffer_cache_hit_ratio:
  name: "Buffer Cache命中率"
  description: "监控数据块在内存中的命中率。低于95%通常意味着内存不足或SQL效率差"
  tags: [cache, performance, memory]
  required_params: [instance]
  providers:
    oracle: 'oracledb_cache_hit_ratio_value{{instance="{instance}"}}'
    postgresql: 'pg_stat_database_blks_hit{{instance="{instance}"}} / (pg_stat_database_blks_hit{{instance="{instance}"}} + pg_stat_database_blks_read{{instance="{instance}"}})'
  zabbix:
    oracle: 'oracledb.buffer_hit_ratio[{instance}]'
    postgresql: 'pgsql.buffer_hit_ratio[{instance}]'

# ---------------------------------------------------------------------------
# 等待事件（按类别，oracledb_exporter 2.4.1 实际暴露的 8 个等待分类）
# ---------------------------------------------------------------------------
db_wait_application:
  name: "应用级等待"
  description: "应用层等待（如行锁、显式锁），定位应用并发设计问题"
  tags: [wait, lock, application]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_application{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_application[{instance}]'

db_wait_commit:
  name: "提交等待"
  description: "日志刷盘等待（log file sync），高值说明 redo 写入存在瓶颈"
  tags: [wait, commit, io]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_commit{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_commit[{instance}]'

db_wait_concurrency:
  name: "并发等待"
  description: "内部并发竞争等待（如 buffer busy waits、latch），定位热点块争用"
  tags: [wait, concurrency, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_concurrency{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_concurrency[{instance}]'

db_wait_configuration:
  name: "配置等待"
  description: "因数据库参数配置不当引发的等待（如日志组太少、空间不足）"
  tags: [wait, configuration, tuning]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_configuration{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_configuration[{instance}]'

db_wait_network:
  name: "网络等待"
  description: "SQL*Net 消息往返延迟，高值说明网络带宽或延迟存在问题"
  tags: [wait, network, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_network{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_network[{instance}]'

db_wait_other:
  name: "其他等待"
  description: "无法归入标准类别的等待事件总和"
  tags: [wait, other, diagnosis]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_other{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_other[{instance}]'

db_wait_system_io:
  name: "系统I/O等待"
  description: "操作系统层 I/O 等待，定位存储系统性能瓶颈"
  tags: [wait, io, system]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_system_io{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_system_io[{instance}]'

db_wait_user_io:
  name: "用户I/O等待"
  description: "数据库读取数据文件的等待，高值通常说明SQL缺索引或磁盘性能不足"
  tags: [wait, io, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_user_io{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_user_io[{instance}]'

# ---------------------------------------------------------------------------
# Top SQL
# ---------------------------------------------------------------------------
db_top_sql:
  name: "Top SQL执行耗时"
  description: "按执行时间排序的最耗资源 SQL 语句，定位性能瓶颈SQL"
  tags: [sql, performance, top]
  required_params: [instance]
  providers:
    oracle: 'oracledb_top_sql_elapsed{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.top_sql[{instance}]'

# ---------------------------------------------------------------------------
# 表空间
# ---------------------------------------------------------------------------
db_tablespace_usage:
  name: "表空间使用率"
  description: "监控所有表空间的使用百分比，预防存储撑爆导致数据库只读或挂起"
  tags: [storage, tablespace, capacity]
  required_params: [instance]
  providers:
    oracle: 'oracledb_tablespace_used_percent{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.tablespace_usage[{instance}]'

db_tablespace_free:
  name: "表空间剩余空间"
  description: "查看所有表空间剩余可用字节数，辅助容量规划与扩容决策"
  tags: [storage, tablespace, capacity]
  required_params: [instance]
  providers:
    oracle: 'oracledb_tablespace_free{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.tablespace_free[{instance}]'

db_tablespace_max:
  name: "表空间最大容量"
  description: "监控各表空间的最大可扩展容量"
  tags: [storage, capacity]
  required_params: [instance]
  providers:
    oracle: 'oracledb_tablespace_max_bytes{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.tablespace_max[{instance}]'

db_tablespace_total:
  name: "表空间当前大小"
  description: "监控各表空间的当前磁盘占用总量"
  tags: [storage, capacity]
  required_params: [instance]
  providers:
    oracle: 'oracledb_tablespace_bytes{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.tablespace_bytes[{instance}]'

# ---------------------------------------------------------------------------
# 系统负载（node_exporter）
# ---------------------------------------------------------------------------
db_system_load:
  name: "数据库主机系统负载"
  description: "监控数据库所在主机的系统负载（Load Average），辅助判断是DB问题还是OS问题"
  tags: [system, os, load]
  required_params: [instance]
  providers:
    oracle: 'node_load1{{instance="{instance}"}}'
    postgresql: 'node_load1{{instance="{instance}"}}'
    mysql: 'node_load1{{instance="{instance}"}}'
  zabbix:
    oracle: 'system.load1[{instance}]'
    postgresql: 'system.load1[{instance}]'
    mysql: 'system.load1[{instance}]'

db_disk_usage:
  name: "数据库挂载点磁盘可用空间"
  description: "监控数据库数据文件所在磁盘分区的剩余空间，预防磁盘空间耗尽"
  tags: [disk, storage, os]
  required_params: [instance]
  providers:
    oracle: 'node_filesystem_avail_bytes{{instance="{instance}"}}'
    postgresql: 'node_filesystem_avail_bytes{{instance="{instance}"}}'
    mysql: 'node_filesystem_avail_bytes{{instance="{instance}"}}'
  zabbix:
    oracle: 'system.disk_avail[{instance}]'
    postgresql: 'system.disk_avail[{instance}]'
    mysql: 'system.disk_avail[{instance}]'
