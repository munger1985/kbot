# configuration/metrics_mapping.yaml
# =============================================================================
# Oracle 指标基于 oracledb_exporter 2.4.1 实际暴露的指标，校验命令:
# curl -s http://localhost:9161/metrics | grep "^oracledb_" | awk -F'{' '{print $1}' | sort -u
#
# Zabbix 指标 Item Key 基于常见的 Zabbix 数据库监控模板命名约定,
# 实际使用时需根据用户 Zabbix 模板配置调整 Item Key。
#
# OEM 指标基于 Oracle Enterprise Manager 13c R4/R5 REST API 提供的指标集合。
# OEM metric_name/collection 对应用 /em/rest/{version}/targets/{name}/metrics/{metric}/{collection}。
# =============================================================================

# ---------------------------------------------------------------------------
# 可用性
# ---------------------------------------------------------------------------
db_availability:
  name: "数据库实例可用性"
  description: "检查数据库实例是否在线且可被监控系统正常采集"
  tags: [availability, health, fundamental]
  required_params: [instance]
  providers:
    oracle: 'oracledb_up{{instance="{instance}"}}'
    postgresql: 'pg_up{{instance="{instance}"}}'
    mysql: 'mysql_up{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.ping[{{instance}}]'
    postgresql: 'pgsql.ping[{{instance}}]'
    mysql: 'mysql.ping[{{instance}}]'
  oem:
    oracle:
      metric_name: "availability"
      collection: "Availability"
# ---------------------------------------------------------------------------
# 会话与进程
# ---------------------------------------------------------------------------
db_active_sessions:
  name: "会话总数"
  description: "监控当前数据库会话总数，判断是否存在请求积压、连接风暴"
  tags: [session, performance, concurrency]
  required_params: [instance]
  providers:
    oracle: 'oracledb_sessions_value{{instance="{instance}"}}'
    postgresql: 'pg_stat_database_numbackends{{instance="{instance}"}}'
    mysql: 'mysql_global_status_threads_running{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.sessions[{{instance}}]'
    postgresql: 'pgsql.sessions[{{instance}}]'
    mysql: 'mysql.threads[{{instance}}]'
  oem:
    oracle:
      metric_name: "sessions"
      collection: "Sessions"
db_process_count:
  name: "数据库进程数"
  description: "监控数据库当前进程总数，判断是否接近 processes 参数上限"
  tags: [process, capacity, oracle]
  required_params: [instance]
  providers:
    oracle: 'oracledb_process_count{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.processes[{{instance}}]'
  oem:
    oracle:
      metric_name: "processCount"
      collection: "ProcessCount"
# ---------------------------------------------------------------------------
# SQL 负载
# ---------------------------------------------------------------------------
db_execute_count:
  name: "SQL执行次数"
  description: "监控SQL执行累计次数，反映数据库查询负载"
  tags: [query, throughput, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_activity_execute_count{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.executes[{{instance}}]'
  oem:
    oracle:
      metric_name: "sqlResponseTime"
      collection: "SqlResponseTime"
db_parse_count:
  name: "SQL解析次数"
  description: "监控SQL解析累计次数（硬解析+软解析），突增说明未使用绑定变量或共享池压力大"
  tags: [query, parse, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_activity_parse_count_total{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.parses[{{instance}}]'
  oem:
    oracle:
      metric_name: "parseCount"
      collection: "ParseCount"
db_user_commits:
  name: "用户提交数"
  description: "监控用户提交事务的累计次数，反映业务写入负载量级"
  tags: [transaction, throughput, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_activity_user_commits{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.commits[{{instance}}]'
  oem:
    oracle:
      metric_name: "transactions"
      collection: "Transactions"
db_user_rollbacks:
  name: "用户回滚数"
  description: "监控用户回滚事务的累计次数，持续增长说明应用存在异常或锁冲突"
  tags: [transaction, rollback, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_activity_user_rollbacks{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.rollbacks[{{instance}}]'
  oem:
    oracle:
      metric_name: "transactions"
      collection: "Transactions"
# ---------------------------------------------------------------------------
# 缓存命中率
# ---------------------------------------------------------------------------
db_buffer_cache_hit_ratio:
  name: "Buffer Cache命中率"
  description: "监控数据块在内存中的命中率。低于95%通常意味着内存不足或SQL效率差"
  tags: [cache, performance, memory]
  required_params: [instance]
  providers:
    oracle: 'oracledb_cache_hit_ratio_value{{instance="{instance}"}}'
    postgresql: 'pg_stat_database_blks_hit{{instance="{instance}"}} / (pg_stat_database_blks_hit{{instance="{instance}"}} + pg_stat_database_blks_read{{instance="{instance}"}})'
  zabbix:
    oracle: 'oracledb.buffer_hit_ratio[{{instance}}]'
    postgresql: 'pgsql.buffer_hit_ratio[{{instance}}]'
  oem:
    oracle:
      metric_name: "cacheHitRatio"
      collection: "CacheHitRatio"
db_library_cache_hit_ratio:
  name: "Library Cache命中率"
  description: "监控共享SQL区的命中率，低值说明频繁硬解析，需检查绑定变量使用"
  tags: [cache, shared_pool, performance, oracle]
  required_params: [instance]
  providers:
    oracle: 'oracledb_library_cache_hit_ratio{{instance="{instance}"}}'
  oem:
    oracle:
      metric_name: "libraryCacheHitRatio"
      collection: "LibraryCacheHitRatio"
db_redo_log_hit_ratio:
  name: "Redo Log空间争用率"
  description: "监控Redo Log Buffer的争用程度，反映日志写入压力"
  tags: [redo, log, performance, oracle]
  required_params: [instance]
  providers:
    oracle: 'oracledb_redo_no_wait_ratio{{instance="{instance}"}}'
  oem:
    oracle:
      metric_name: "redoStats"
      collection: "RedoStats"
# ---------------------------------------------------------------------------
# 等待事件（按类别，oracledb_exporter 2.4.1 实际暴露的 8 个等待分类）
# OEM 通过 waitTimes 指标 + keyColumn 区分等待类
# ---------------------------------------------------------------------------
db_wait_application:
  name: "应用级等待"
  description: "应用层等待（如行锁、显式锁），定位应用并发设计问题"
  tags: [wait, lock, application]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_application{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_application[{{instance}}]'
  oem:
    oracle:
      metric_name: "waitTimes"
      collection: "WaitTimes"
db_wait_commit:
  name: "提交等待"
  description: "日志刷盘等待（log file sync），高值说明 redo 写入存在瓶颈"
  tags: [wait, commit, io]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_commit{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_commit[{{instance}}]'
  oem:
    oracle:
      metric_name: "waitTimes"
      collection: "WaitTimes"
db_wait_concurrency:
  name: "并发等待"
  description: "内部并发竞争等待（如 buffer busy waits、latch），定位热点块争用"
  tags: [wait, concurrency, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_concurrency{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_concurrency[{{instance}}]'
  oem:
    oracle:
      metric_name: "waitTimes"
      collection: "WaitTimes"
db_wait_configuration:
  name: "配置等待"
  description: "因数据库参数配置不当引发的等待（如日志组太少、空间不足）"
  tags: [wait, configuration, tuning]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_configuration{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_configuration[{{instance}}]'
  oem:
    oracle:
      metric_name: "waitTimes"
      collection: "WaitTimes"
db_wait_network:
  name: "网络等待"
  description: "SQL*Net 消息往返延迟，高值说明网络带宽或延迟存在问题"
  tags: [wait, network, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_network{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_network[{{instance}}]'
  oem:
    oracle:
      metric_name: "waitTimes"
      collection: "WaitTimes"
db_wait_other:
  name: "其他等待"
  description: "无法归入标准类别的等待事件总和"
  tags: [wait, other, diagnosis]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_other{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_other[{{instance}}]'
  oem:
    oracle:
      metric_name: "waitTimes"
      collection: "WaitTimes"
db_wait_system_io:
  name: "系统I/O等待"
  description: "操作系统层 I/O 等待，定位存储系统性能瓶颈"
  tags: [wait, io, system]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_system_io{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_system_io[{{instance}}]'
  oem:
    oracle:
      metric_name: "waitTimes"
      collection: "WaitTimes"
db_wait_user_io:
  name: "用户I/O等待"
  description: "数据库读取数据文件的等待，高值通常说明SQL缺索引或磁盘性能不足"
  tags: [wait, io, performance]
  required_params: [instance]
  providers:
    oracle: 'oracledb_wait_time_user_io{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.wait_user_io[{{instance}}]'
  oem:
    oracle:
      metric_name: "waitTimes"
      collection: "WaitTimes"
# ---------------------------------------------------------------------------
# Top SQL
# ---------------------------------------------------------------------------
db_top_sql:
  name: "Top SQL执行耗时"
  description: "按执行时间排序的最耗资源 SQL 语句，定位性能瓶颈SQL"
  tags: [sql, performance, top]
  required_params: [instance]
  providers:
    oracle: 'oracledb_top_sql_elapsed{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.top_sql[{{instance}}]'
  oem:
    oracle:
      metric_name: "topSQL"
      collection: "ElapsedTime"
# ---------------------------------------------------------------------------
# 表空间
# ---------------------------------------------------------------------------
db_tablespace_usage:
  name: "表空间使用率"
  description: "监控所有表空间的使用百分比，预防存储撑爆导致数据库只读或挂起"
  tags: [storage, tablespace, capacity]
  required_params: [instance]
  providers:
    oracle: 'oracledb_tablespace_used_percent{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.tablespace_usage[{{instance}}]'
  oem:
    oracle:
      metric_name: "tablespaceSpace"
      collection: "TablespaceSpace"
db_tablespace_free:
  name: "表空间剩余空间"
  description: "查看所有表空间剩余可用字节数，辅助容量规划与扩容决策"
  tags: [storage, tablespace, capacity]
  required_params: [instance]
  providers:
    oracle: 'oracledb_tablespace_free{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.tablespace_free[{{instance}}]'
  oem:
    oracle:
      metric_name: "tablespaceSpace"
      collection: "TablespaceSpace"
db_tablespace_max:
  name: "表空间最大容量"
  description: "监控各表空间的最大可扩展容量"
  tags: [storage, capacity]
  required_params: [instance]
  providers:
    oracle: 'oracledb_tablespace_max_bytes{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.tablespace_max[{{instance}}]'
  oem:
    oracle:
      metric_name: "tablespaceSpace"
      collection: "TablespaceSpace"
db_tablespace_total:
  name: "表空间当前大小"
  description: "监控各表空间的当前磁盘占用总量"
  tags: [storage, capacity]
  required_params: [instance]
  providers:
    oracle: 'oracledb_tablespace_bytes{{instance="{instance}"}}'
  zabbix:
    oracle: 'oracledb.tablespace_bytes[{{instance}}]'
  oem:
    oracle:
      metric_name: "tablespaceSpace"
      collection: "TablespaceSpace"
# ---------------------------------------------------------------------------
# 系统负载（node_exporter / OEM Host）
# ---------------------------------------------------------------------------
db_system_load:
  name: "数据库主机系统负载"
  description: "监控数据库所在主机的系统负载（Load Average），辅助判断是DB问题还是OS问题"
  tags: [system, os, load]
  required_params: [instance]
  providers:
    oracle: 'node_load1{{instance="{instance}"}}'
    postgresql: 'node_load1{{instance="{instance}"}}'
    mysql: 'node_load1{{instance="{instance}"}}'
  zabbix:
    oracle: 'system.load1[{{instance}}]'
    postgresql: 'system.load1[{{instance}}]'
    mysql: 'system.load1[{{instance}}]'
  oem:
    oracle:
      metric_name: "host"
      collection: "Host"
db_disk_usage:
  name: "数据库挂载点磁盘可用空间"
  description: "监控数据库数据文件所在磁盘分区的剩余空间，预防磁盘空间耗尽"
  tags: [disk, storage, os]
  required_params: [instance]
  providers:
    oracle: 'node_filesystem_avail_bytes{{instance="{instance}"}}'
    postgresql: 'node_filesystem_avail_bytes{{instance="{instance}"}}'
    mysql: 'node_filesystem_avail_bytes{{instance="{instance}"}}'
  zabbix:
    oracle: 'system.disk_avail[{{instance}}]'
    postgresql: 'system.disk_avail[{{instance}}]'
    mysql: 'system.disk_avail[{{instance}}]'
  oem:
    oracle:
      metric_name: "filesystem"
      collection: "Filesystem"
# ===========================================================================
# OEM 专属深度诊断指标（OEM-only，Prometheus/Zabbix 无对应映射）
# ===========================================================================

# ---------------------------------------------------------------------------
# ASH (Active Session History) 实时会话活动分析
# ---------------------------------------------------------------------------
db_ash_top_events:
  name: "ASH Top 等待事件"
  description: "从 Active Session History 获取当前最活跃的等待事件分布，精准定位瞬时性能瓶颈"
  tags: [ash, wait, diagnosis, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "ash"
      collection: "Ash"

db_ash_top_sql:
  name: "ASH Top SQL"
  description: "从 Active Session History 获取当前消耗最多的 SQL 与 Session 详情"
  tags: [ash, sql, diagnosis, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "ash"
      collection: "Ash"

# ---------------------------------------------------------------------------
# I/O 统计
# ---------------------------------------------------------------------------
db_io_total_stats:
  name: "I/O 总统计"
  description: "数据库整体 I/O 的读写吞吐量和延迟，定位存储性能瓶颈"
  tags: [io, throughput, diagnosis, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "ioStatsTotal"
      collection: "IoStatsTotal"

db_io_per_file:
  name: "每个数据文件的 I/O 统计"
  description: "按数据文件维度的 I/O 读写量分布，定位热点文件"
  tags: [io, file, diagnosis, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "ioStats"
      collection: "IoStats"

# ---------------------------------------------------------------------------
# Alert Log
# ---------------------------------------------------------------------------
db_alert_log_errors:
  name: "告警日志错误数"
  description: "从 OEM 告警日志中统计 ORA- 错误的出现频次，辅助故障定位"
  tags: [alert_log, error, diagnosis, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "alertLog"
      collection: "AlertLog"

# ---------------------------------------------------------------------------
# Data Guard
# ---------------------------------------------------------------------------
db_dg_overall_status:
  name: "DataGuard 总体状态"
  description: "DataGuard 配置的整体健康状态，检查保护模式、同步状态"
  tags: [dataguard, ha, diagnosis, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "dgOverallStatus"
      collection: "DgOverallStatus"

db_dg_lag:
  name: "DataGuard 同步延迟"
  description: "DataGuard 主备库之间的 redo 应用延迟（秒），判断数据保护时效"
  tags: [dataguard, lag, diagnosis, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "dgLag"
      collection: "DgLag"

# ---------------------------------------------------------------------------
# RAC
# ---------------------------------------------------------------------------
db_rac_interconnect:
  name: "RAC 集群互联延迟"
  description: "RAC 节点间 Global Cache 互联延迟，高值说明节点间网络或 DRM 问题"
  tags: [rac, interconnect, diagnosis, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "racStats"
      collection: "RacStats"

db_rac_gcs_cr_block:
  name: "RAC GCS CR 块请求"
  description: "RAC 全局缓存服务的一致读块请求数，反映 RAC 集群内数据块竞争程度"
  tags: [rac, gcs, diagnosis, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "racStats"
      collection: "RacStats"

# ---------------------------------------------------------------------------
# Undo 与 Redo
# ---------------------------------------------------------------------------
db_undo_space:
  name: "Undo 表空间使用"
  description: "监控 Undo 表空间的使用量和未过期数据量，预防 ORA-01555 快照过旧"
  tags: [undo, storage, diagnosis, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "undoSpace"
      collection: "UndoSegment"

db_redo_gen_rate:
  name: "Redo 生成速率"
  description: "每秒 Redo 日志生成量（字节），反映数据库写入负载峰值"
  tags: [redo, throughput, diagnosis, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "redoStats"
      collection: "RedoStats"

# ---------------------------------------------------------------------------
# AWR 基础指标（OEM 自动 AWR 采集）
# ---------------------------------------------------------------------------
db_awr_db_time:
  name: "AWR DB Time"
  description: "AWR 快照区间内的数据库总耗时（DB Time），评估整体负载趋势"
  tags: [awr, diagnosis, performance, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "awr"
      collection: "Awr"

db_awr_throughput:
  name: "AWR 吞吐量"
  description: "AWR 区间内每秒事务数、SQL 执行次数等吞吐量指标"
  tags: [awr, throughput, diagnosis, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "awr"
      collection: "Awr"

db_awr_top_sql:
  name: "AWR Top SQL"
  description: "AWR 快照保留的 Top SQL 按资源消耗排序，基于 AWR 持久化数据"
  tags: [awr, sql, diagnosis, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "awr"
      collection: "Awr"

# ---------------------------------------------------------------------------
# ADDM (Automatic Database Diagnostic Monitor)
# ---------------------------------------------------------------------------
db_addm_findings:
  name: "ADDM 诊断发现"
  description: "OEM ADDM 分析结果 — 自动诊断出的数据库性能问题及建议，含预估收益"
  tags: [addm, diagnosis, advisor, oem_deep]
  required_params: [instance]
  oem:
    oracle:
      metric_name: "addm"
      collection: "Addm"
