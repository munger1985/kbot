[api]
service_name = "kbot-agent-runtime-api"
service_version = "4.0.0"
service_host = "0.0.0.0"
service_port = 18100

[worker]
service_name = "kbot-agent-runtime-worker"
worker_id = "agent-runtime-worker-local"
poll_interval_seconds = 1.0
lease_seconds = 120
memory_lease_seconds = 300
retention_poll_interval_seconds = 60
max_tasks_per_run = 16
max_parallel_tasks = 4
max_total_retries = 16
max_task_timeout_seconds = 600

[attachments]
# API 与 Worker 必须挂载同一个持久卷；生产环境可替换为对象存储适配器。
local_storage_path = "./agent_runtime_storage"

[ask_data_api]
api_endpoint = "http://127.0.0.1:10090/aireport/chat/with_selectai_api"
profiles_endpoint = "http://127.0.0.1:10090/aireport/admin/list_profiles"
api_key_env = "KBOT_MCP_DATA_API_KEY"
timeout = 120
max_rows = 1000
max_response_bytes = 10485760

[knowledge_core]
base_url = "http://127.0.0.1:18090"
audience = "kbot-knowledge-core-api"
timeout_seconds = 120

[aiops]
base_url = "http://127.0.0.1:18110"
audience = "kbot-aiops-api"
timeout_seconds = 120

[llm]
base_url = "http://127.0.0.1:18092"
audience = "kbot-model-llm"
timeout_seconds = 300

[embedding]
base_url = "http://127.0.0.1:18091"
audience = "kbot-model-embedding"
timeout_seconds = 300

[vlm]
base_url = "http://127.0.0.1:18094"
audience = "kbot-model-vlm"
timeout_seconds = 300
