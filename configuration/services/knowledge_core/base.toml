[api]
service_name = "kbot-knowledge-core-api"
service_version = "4.0.0"
service_host = "0.0.0.0"
service_port = 18090
receipt_ttl_seconds = 86400

[storage]
local_object_storage_path = "./knowledge_core_storage"

[parser]
service_name = "kbot-knowledge-core-parser"
service_version = "4.0.0"
service_host = "0.0.0.0"
service_port = 18095
worker_id = "kc-parser-local"
local_artifacts_path = "./cached_models/docling"
claim_interval_seconds = 2.0
lease_seconds = 600
evidence_batch_size = 100

[projection]
service_name = "kbot-knowledge-core-projection"
worker_id = "kc-projection-local"
poll_interval_seconds = 2.0
lease_seconds = 600
index_batch_size = 64

[parse_policy]
ocr_model = ""
# TEXT 仅 Docling；AUTO 低质量页视觉兜底；VISUAL 强制整页视觉；HYBRID 全页融合。
parse_strategy = "AUTO"
visual_description_prompt = "请客观描述图片中的可见事实、文字、对象及其关系；不要推测图片之外的信息。"
full_page_visual_prompt = "请将整张文档页面转换为结构化 Markdown。原文照录文字、数字、单位和符号；准确还原标题层级、表格、列表、公式及图表关系；不要编造内容，不要输出代码块或额外解释。"
visual_min_text_characters = 80
visual_min_mean_confidence = 0.65
visual_max_gibberish_ratio = 0.08
visual_max_concurrency = 2

[dsocr]
enabled = false
api_endpoint = "http://localhost:18097/v1/chat/completions"
timeout = 600
crop_mode = true
max_tokens = 8192
temperature = 0.0

[embedding]
base_url = "http://127.0.0.1:18091"
audience = "kbot-model-embedding"
timeout_seconds = 300
health_check_timeout_seconds = 10

[llm]
base_url = "http://127.0.0.1:18092"
audience = "kbot-model-llm"
timeout_seconds = 300

[vlm]
base_url = "http://127.0.0.1:18094"
audience = "kbot-model-vlm"
timeout_seconds = 600

[visual]
base_url = "http://127.0.0.1:18093"
audience = "kbot-model-visual"
timeout_seconds = 300

[knowledge_core]
base_url = "http://127.0.0.1:18090"
audience = "kbot-knowledge-core-api"
timeout_seconds = 600
