[api]
service_name = "kbot-aiops-api"
service_version = "4.0.0"
service_host = "0.0.0.0"
service_port = 18110

[runtime]
system_aiops_agent_id = "019c03b5-4b88-7ab2-8c19-7b6ea34f2a11"

[worker]
service_name = "kbot-aiops-worker"
service_version = "4.0.0"
service_host = "0.0.0.0"
service_port = 18112
worker_id = "aiops-worker-local"
concurrency = 4
claim_interval_seconds = 2.0
lease_seconds = 120
heartbeat_seconds = 30

[scheduler]
service_name = "kbot-aiops-scheduler"
service_version = "4.0.0"
service_host = "0.0.0.0"
service_port = 18113
scheduler_id = "aiops-scheduler-local"
scan_interval_seconds = 30
lease_seconds = 120

[executor]
service_name = "kbot-aiops-db-executor"
service_version = "4.0.0"
service_host = "0.0.0.0"
service_port = 18111
executor_instance_id = "aiops-executor-local"
mutation_enabled = false
readonly_concurrency = 8
mutation_concurrency = 1
statement_timeout_seconds = 60
max_result_rows = 5000
max_result_bytes = 10485760
max_result_columns = 128
max_cell_chars = 32768
grant_secret_env = "KBOT_AIOPS_DIAGNOSTIC_GRANT_SECRET"
grant_issuer = "kbot-aiops-worker"
grant_ttl_seconds = 45
mutation_grant_secret_env = "KBOT_AIOPS_MUTATION_GRANT_SECRET"
mutation_grant_issuer = "kbot-aiops-api"
mutation_grant_ttl_seconds = 30

[clients.agent_runtime]
base_url = "http://127.0.0.1:18100"
audience = "kbot-agent-runtime-api"
timeout_seconds = 120

[clients.model_serving]
base_url = "http://127.0.0.1:18092"
audience = "kbot-model-llm"
timeout_seconds = 300

[clients.knowledge_core]
base_url = "http://127.0.0.1:18090"
audience = "kbot-knowledge-core-api"
timeout_seconds = 120

[clients.aiops_api]
base_url = "http://127.0.0.1:18110"
audience = "kbot-aiops-api"
timeout_seconds = 120

[clients.db_executor]
base_url = "http://127.0.0.1:18111"
audience = "kbot-aiops-db-executor"
timeout_seconds = 120

[secret_store]
provider = "environment"

[limits]
max_input_chars = 32000
max_artifact_bytes = 20971520
max_tasks_per_run = 64
run_timeout_seconds = 3600
max_targets_per_inspection_fire = 100

[monitoring]
default_window_seconds = 3600
provider_timeout_seconds = 30
webhook_replay_seconds = 300
max_webhook_bytes = 1048576
max_response_bytes = 5242880
payload_store_root = "/tmp/kbot-aiops-monitor-payloads"

[diagnosis]
enabled = false
model_technical_name = "aiops-diagnosis"
model_revision = "1"
max_rounds = 3
max_tool_calls = 12
max_output_tokens_per_call = 4096
max_evidence_facts = 256

[management]
cursor_secret_env = "KBOT_AIOPS_CURSOR_SECRET"
webhook_key_secret_env = "KBOT_AIOPS_WEBHOOK_KEY_SECRET"
cursor_ttl_seconds = 900
webhook_key_overlap_seconds = 3600
agent_execution_enabled = false

[[management.inspection_templates]]
template_id = "database_daily"
template_version = "1.0.0"
schedule_resolver_version = "1.0.0"
allowed_override_keys = ["thresholds", "window", "optional_checks"]
