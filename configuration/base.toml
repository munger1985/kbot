# 所有独立服务共享的 KBot 4.0 平台配置。
[platform]
app_id = 1
version = "4.0.0"

[log]
rotation = "100 MB"
retention = "10 days"
api_log_enabled = true

[security]
api_key_pepper_env = "KBOT_API_KEY_PEPPER"
internal_service_token_env = "KBOT_INTERNAL_SERVICE_TOKEN"
internal_jwt_secret_env = "KBOT_INTERNAL_JWT_SECRET"
service_identity_jwt_secret_env = "KBOT_SERVICE_IDENTITY_JWT_SECRET"
internal_jwt_issuer = "kbot-platform"
internal_jwt_ttl_seconds = 60
service_identity_jwt_ttl_seconds = 60
internal_jwt_clock_skew_seconds = 5

[database.oracle]
password_env = "KBOT_ORACLE_PASSWORD"
port = 1521

[database.sqlalchemy]
echo = false
pool_size = 10
pool_timeout = 60
max_overflow = 20
pool_pre_ping = true
pool_use_lifo = true
pool_recycle = 1800

[vector]
dimensions = 1536
