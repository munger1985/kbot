<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kbot3 AIOps SSE 客户端</title>
<style>
:root {
  --bg: #f5f7fa;
  --card-bg: #fff;
  --text: #1a1a2e;
  --text-secondary: #6b7280;
  --border: #e5e7eb;
  --primary: #2563eb;
  --success: #16a34a;
  --warning: #d97706;
  --danger: #dc2626;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }

/* Header */
.header { background: var(--card-bg); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.header h1 { font-size: 20px; margin-bottom: 8px; }
.header p { color: var(--text-secondary); font-size: 14px; }

/* Config Form */
.config-form { background: var(--card-bg); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.form-row label { font-size: 13px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 4px; }
.form-row input, .form-row select { flex: 1; min-width: 140px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
.form-row input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-stop { background: var(--danger); color: #fff; margin-left: 8px; }
.btn-stop:hover { background: #b91c1c; }
.btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; }

/* Status bar */
.status-bar { padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.status-connecting { background: #fef3c7; color: #92400e; }
.status-connected { background: #dcfce7; color: #166534; }
.status-error { background: #fee2e2; color: #991b1b; }
.status-done { background: #dbeafe; color: #1e40af; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-connecting .status-dot { background: #f59e0b; animation: pulse 1s infinite; }
.status-connected .status-dot { background: #22c55e; }
.status-error .status-dot { background: #ef4444; }
.status-done .status-dot { background: #3b82f6; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

/* Messages */
.messages { display: flex; flex-direction: column; gap: 12px; }
.msg { background: var(--card-bg); border-radius: var(--radius); padding: 16px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--text-secondary); }
.msg-icon { font-size: 16px; }

/* Thinking Process */
.think-item { border-left: 3px solid var(--border); padding: 8px 12px; margin: 8px 0; background: #f9fafb; border-radius: 0 8px 8px 0; }
.think-item.type-thought { border-color: #a78bfa; }
.think-item.type-call { border-color: #60a5fa; }
.think-item.type-metric_results, .think-item.type-monitor_results { border-color: #34d399; }
.think-item.type-action_items { border-color: #fbbf24; }
.think-item.type-verification_results { border-color: #f472b6; }
.think-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }

/* Answer */
.answer-block { font-size: 15px; line-height: 1.7; }
.answer-block table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.answer-block th, .answer-block td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.answer-block th { background: #f9fafb; font-weight: 600; }
.answer-block code { background: #f1f5f9; padding: 1px 4px; border-radius: 4px; font-size: 13px; }
.answer-block pre { background: #1e293b; color: #e2e8f0; padding: 12px 16px; border-radius: 8px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
.answer-block pre code { background: none; padding: 0; color: inherit; }

/* SQL Results Table */
.sql-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 4px 0; }
.sql-table th { background: #f1f5f9; padding: 4px 8px; border: 1px solid var(--border); text-align: left; font-weight: 600; }
.sql-table td { padding: 3px 8px; border: 1px solid var(--border); }

/* Action Items */
.action-card { border: 1px solid #fbbf24; border-radius: 8px; padding: 12px; margin: 8px 0; background: #fffbeb; }
.action-risk { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
.risk-low { background: #dcfce7; color: #166534; }
.risk-medium { background: #fef3c7; color: #92400e; }
.risk-high { background: #fed7aa; color: #9a3412; }
.risk-critical { background: #fee2e2; color: #991b1b; }
.action-sql { background: #1e293b; color: #e2e8f0; padding: 8px 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; margin: 8px 0; white-space: pre-wrap; }

/* HITL Forms */
.hitl-card { border: 2px solid #60a5fa; border-radius: 12px; padding: 16px; margin: 8px 0; background: #eff6ff; }
.hitl-card.approval { border-color: #f59e0b; background: #fffbeb; }
.hitl-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.hitl-reason { color: var(--text-secondary); font-size: 13px; margin-bottom: 8px; }
.hitl-sql { background: #1e293b; color: #e2e8f0; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin: 8px 0; white-space: pre-wrap; }
.hitl-copy-btn { padding: 4px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; margin-bottom: 8px; }
.hitl-textarea, .hitl-input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; margin: 4px 0 8px; }
.hitl-btns { display: flex; gap: 8px; }
.hitl-btn-submit { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
.hitl-btn-cancel { background: #fee2e2; color: #991b1b; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.hitl-btn-approve { background: #16a34a; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
.hitl-btn-reject { background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }

/* Verification Card */
.verify-card { border-radius: 12px; overflow: hidden; margin: 8px 0; border: 2px solid #e5e7eb; }
.verify-card.verified { border-color: #bbf7d0; }
.verify-card.degraded { border-color: #fde68a; }
.verify-card.failed { border-color: #fecaca; }
.verify-card-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.verify-card.verified .verify-card-header { background: linear-gradient(135deg, #f0fdf4, #dcfce7); }
.verify-card.degraded .verify-card-header { background: linear-gradient(135deg, #fefce8, #fef9c3); }
.verify-card.failed .verify-card-header { background: linear-gradient(135deg, #fef2f2, #fee2e2); }
.verify-icon { font-size: 28px; }
.verify-status { font-size: 16px; font-weight: 700; }
.verify-card.verified .verify-status { color: #16a34a; }
.verify-card.degraded .verify-status { color: #d97706; }
.verify-card.failed .verify-status { color: #dc2626; }
.verify-body { padding: 12px 16px; }
.verify-section-title { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin: 10px 0 4px; }
.verify-metrics-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.verify-metrics-table th, .verify-metrics-table td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
.verify-metrics-table th { background: #f9fafb; }
.change-up { color: #ef4444; font-weight: 600; }
.change-down { color: #22c55e; font-weight: 600; }
.health-ok { color: #16a34a; }
.health-fail { color: #dc2626; }

/* Empty state */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🤖 kbot3 AIOps SSE 客户端</h1>
    <p>实时监控 SSE 事件流 — 支持所有 PacketType 渲染，纯 JavaScript，无框架依赖</p>
  </div>

  <!-- 配置表单 -->
  <div class="config-form">
    <div class="form-row">
      <div style="flex:2;min-width:250px">
        <label>API 地址</label>
        <input id="apiUrl" value="http://localhost:18090/api/ops/chat" placeholder="http://host:port/api/ops/chat">
      </div>
      <div style="flex:1;min-width:120px">
        <label>Agent ID</label>
        <input id="agentId" placeholder="Agent ID">
      </div>
    </div>
    <div class="form-row">
      <div style="flex:1;min-width:120px">
        <label>实例 ID</label>
        <input id="instanceId" placeholder="数据库实例 ID">
      </div>
      <div style="flex:1;min-width:120px">
        <label>用户 ID</label>
        <input id="userId" value="admin">
      </div>
      <div style="flex:1;min-width:120px">
        <label>会话 ID (留空自动生成)</label>
        <input id="sessionId" placeholder="new_session">
      </div>
    </div>
    <div class="form-row">
      <div style="flex:2;min-width:250px">
        <label>问题 / 指令</label>
        <input id="query" value="查看当前数据库表空间使用率" placeholder="输入自然语言运维指令">
      </div>
    </div>
    <div class="form-row" style="align-items:flex-end">
      <button class="btn btn-primary" id="btnSend" onclick="sendChat()">
        ▶ 发送诊断请求
      </button>
      <button class="btn btn-stop" id="btnStop" onclick="stopStream()" style="display:none">
        ■ 停止
      </button>
      <button class="btn-sm" onclick="clearMessages()">清空消息</button>
    </div>
  </div>

  <!-- 状态栏 -->
  <div id="statusBar" class="status-bar" style="display:none"></div>

  <!-- 消息列表 -->
  <div id="messages" class="messages">
    <div class="empty-state">
      <div class="empty-icon">💬</div>
      <p>填入配置，输入运维问题，点击发送</p>
    </div>
  </div>
</div>

<script>
// ================================================================
// 全局状态
// ================================================================
let abortCtrl = null;
let isStreaming = false;
let currentMsg = null;    // 当前 agent 消息 DOM 元素
let currentMsgData = {};  // 当前 agent 消息数据

const statusMap = {
  verified:  { icon: '✅', text: '修复成功' },
  degraded:  { icon: '⚠️', text: '部分恢复' },
  failed:    { icon: '❌', text: '修复失败' },
  skipped:   { icon: '⏭️', text: '跳过验证' },
};
const riskMap = {
  low:      { text: '🟢 低风险', cls: 'risk-low' },
  medium:   { text: '🟡 中风险', cls: 'risk-medium' },
  high:     { text: '🟠 高风险', cls: 'risk-high' },
  critical: { text: '🔴 严重风险', cls: 'risk-critical' },
};

// ================================================================
// 发送请求
// ================================================================
function sendChat() {
  if (isStreaming) return;

  const apiUrl = document.getElementById('apiUrl').value.trim();
  const agentId = document.getElementById('agentId').value.trim();
  const instanceId = document.getElementById('instanceId').value.trim();
  const userId = document.getElementById('userId').value.trim();
  const sessionId = document.getElementById('sessionId').value.trim() || 'new_session';
  const query = document.getElementById('query').value.trim();

  if (!apiUrl || !agentId || !instanceId || !query) {
    setStatus('请填写 API 地址、Agent ID、实例 ID 和问题', 'error');
    return;
  }

  // 创建用户消息
  addUserMessage(query);

  // 创建 agent 消息占位
  currentMsgData = {
    fullContent: '',
    thinkingProcess: [],
    contentBlocks: [],
    isThinking: true,
  };
  currentMsg = addAgentPlaceholder();

  // 控制按钮
  isStreaming = true;
  document.getElementById('btnSend').disabled = true;
  document.getElementById('btnStop').style.display = 'inline-block';

  abortCtrl = new AbortController();
  setStatus('连接中...', 'connecting');

  const body = {
    agent_id: agentId,
    instance_id: instanceId,
    user_id: userId,
    session_id: sessionId,
    query: query,
    images_base64: [],
  };

  fetch(apiUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    signal: abortCtrl.signal,
  })
  .then(response => {
    if (!response.ok) return response.json().then(e => { throw new Error(e.detail?.message || e.message || 'HTTP ' + response.status); });
    setStatus('接收数据中...', 'connected');
    return readSSEStream(response);
  })
  .catch(err => {
    if (err.name === 'AbortError') return;
    setStatus('错误: ' + err.message, 'error');
    if (currentMsg && currentMsgData && !currentMsgData.fullContent) {
      currentMsgData.fullContent = '[错误]: ' + err.message;
    }
    finishStream();
  });
}

function stopStream() {
  if (abortCtrl) { abortCtrl.abort(); abortCtrl = null; }
  finishStream();
}

function finishStream() {
  isStreaming = false;
  if (currentMsgData) currentMsgData.isThinking = false;
  renderCurrentMessage();
  document.getElementById('btnSend').disabled = false;
  document.getElementById('btnStop').style.display = 'none';
  abortCtrl = null;
}

// ================================================================
// SSE 流读取
// ================================================================
async function readSSEStream(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let eventType = '';

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;

        if (trimmed.startsWith('event:')) {
          eventType = trimmed.slice(6).trim();
        } else if (trimmed.startsWith('data:')) {
          const data = trimmed.slice(5).trim();
          if (data === '[DONE]') continue;
          if (eventType && data) {
            try {
              const parsed = JSON.parse(data);
              const type = eventType.replace('PacketType.', '').toLowerCase();
              handlePacket(type, parsed);
            } catch (e) {
              console.warn('Parse error:', e);
            }
          }
        }
      }
    }
  } finally {
    try { reader.cancel(); } catch (_) {}
  }

  setStatus('完成', 'done');
  finishStream();
}

// ================================================================
// 包处理器 — 对应所有 PacketType
// ================================================================
function handlePacket(type, data) {
  const content = data.content;
  switch (type) {
    // ── 元数据 ──
    case 'metadata':
      if (content && typeof content === 'object') {
        if (content.session_id) {
          document.getElementById('sessionId').value = content.session_id;
        }
      }
      break;

    // ── 思考流 ──
    case 'thought':
      if (content) {
        const tps = currentMsgData.thinkingProcess;
        const last = tps[tps.length - 1];
        if (last && last.type === 'thought') { last.content += content; }
        else { tps.push({ type: 'thought', content: String(content) }); }
      }
      break;

    // ── 技能调用 ──
    case 'call': {
      const c = content;
      const skill = (c && typeof c === 'object') ? (c.skill || c.name || '') : String(data.skill || content || '');
      const desc = (c && typeof c === 'object') ? (c.description || '') : (data.description || '');
      if (skill) {
        const tps = currentMsgData.thinkingProcess;
        const last = tps[tps.length - 1];
        if (last && last.type === 'call' && last.skill === skill) { last.description = desc; }
        else { tps.push({ type: 'call', skill, description: desc }); }
      }
      break;
    }

    // ── 指标/监控数据 ──
    case 'metric_results':
    case 'monitor_results':
      if (content) {
        currentMsgData.thinkingProcess.push({ type: type, content: content });
      }
      break;

    // ── 图谱结果 ──
    case 'graph_results':
      if (content) {
        currentMsgData.thinkingProcess.push({ type: 'graph_results', content: content });
      }
      break;

    // ── 自愈变更建议 ──
    case 'action_items':
      if (content) {
        currentMsgData.thinkingProcess.push({ type: 'action_items', content: content });
      }
      break;

    // ── 验证结果 (NEW) ──
    case 'verification_results':
      if (content) {
        currentMsgData.isThinking = false;
        currentMsgData.thinkingProcess.push({ type: 'verification_results', content: content });
      }
      break;

    // ── 答案 (累积, 50ms 批量刷新) ──
    case 'answer':
      if (content) {
        currentMsgData.isThinking = false;
        currentMsgData.fullContent += String(content);
        const blocks = currentMsgData.contentBlocks;
        const last = blocks[blocks.length - 1];
        if (last && last.type === 'answer') { last.content = currentMsgData.fullContent; }
        else { blocks.push({ type: 'answer', content: currentMsgData.fullContent }); }
        debounceRender();
      }
      break;

    // ── 文档检索 ──
    case 'doc_results': {
      const docs = content || data.results || [];
      if (Array.isArray(docs) && docs.length > 0) {
        currentMsgData.references = docs;
      }
      break;
    }

    // ── 图表 ──
    case 'echarts': {
      const opt = (content && typeof content === 'object')
        ? (content.option || content.config || content)
        : (data.option || data.config);
      if (opt) {
        const title = (content && typeof content === 'object') ? (content.title || '') : (data.title || '');
        if (!currentMsgData.echarts) currentMsgData.echarts = [];
        currentMsgData.echarts.push({ title, config: opt });
        currentMsgData.contentBlocks.push({ type: 'echarts', data: { title, config: opt } });
      }
      break;
    }

    // ── 错误 ──
    case 'error': {
      const msg = content || data.message || '发生未知错误';
      currentMsgData.isThinking = false;
      if (currentMsgData.fullContent) {
        currentMsgData.fullContent += '\n\n[错误]: ' + msg;
      } else {
        currentMsgData.fullContent = '[错误]: ' + msg;
      }
      const blocks = currentMsgData.contentBlocks;
      const last = blocks[blocks.length - 1];
      if (last && last.type === 'answer') { last.content = currentMsgData.fullContent; }
      else { blocks.push({ type: 'answer', content: currentMsgData.fullContent }); }
      break;
    }

    // ── 等待用户输入 (HITL) ──
    case 'wait_for_user':
      currentMsgData.isThinking = false;
      currentMsgData.hitlRequest = {
        type: 'input',
        request_id: (content && typeof content === 'object') ? (content.request_id || '') : '',
        reason: (content && typeof content === 'object') ? (content.reason || '') : '',
        sql_to_run: (content && typeof content === 'object') ? (content.sql_to_run || '') : '',
        expected_fields: (content && typeof content === 'object') ? (content.expected_fields || []) : [],
      };
      break;

    // ── 审批请求 (HITL) ──
    case 'require_approval':
      currentMsgData.isThinking = false;
      currentMsgData.hitlRequest = {
        type: 'approval',
        request_id: (content && typeof content === 'object') ? (content.request_id || '') : '',
        reason: (content && typeof content === 'object') ? (content.reason || '') : '',
        action_sql: (content && typeof content === 'object') ? (content.action_sql || '') : '',
        impact: (content && typeof content === 'object') ? (content.impact || '') : '',
        rollback_sql: (content && typeof content === 'object') ? (content.rollback_sql || '') : '',
        risk_level: (content && typeof content === 'object') ? (content.risk_level || 'medium') : 'medium',
      };
      break;

    // ── 结束 ──
    case 'done':
      currentMsgData.isThinking = false;
      setStatus('完成', 'done');
      finishStream();
      break;

    default:
      console.log('Unknown packet type:', type, data);
  }

  renderCurrentMessage();
}

// ================================================================
// 渲染
// ================================================================
let renderTimer = null;
function debounceRender() {
  if (renderTimer) clearTimeout(renderTimer);
  renderTimer = setTimeout(renderCurrentMessage, 50);
}

function renderCurrentMessage() {
  if (!currentMsg) return;
  const md = currentMsgData;
  const msgEl = currentMsg.querySelector('.msg-body');
  if (!msgEl) return;

  let html = '';

  // 思考中动画
  if (md.isThinking) {
    html += '<div class="think-item type-thought"><span style="color:#6b7280">⏳ 正在思考...</span></div>';
  }

  // 思考过程
  (md.thinkingProcess || []).forEach(tp => {
    switch (tp.type) {
      case 'thought':
        html += '<div class="think-item type-thought"><div class="think-label">💭 思考</div><div>' + escapeHtml(String(tp.content || '').substring(0, 300)) + '</div></div>';
        break;
      case 'call':
        html += '<div class="think-item type-call"><div class="think-label">🔧 调用技能: ' + escapeHtml(tp.skill || '') + '</div>' + (tp.description ? '<div style="font-size:12px;color:#6b7280">' + escapeHtml(tp.description) + '</div>' : '') + '</div>';
        break;
      case 'metric_results':
      case 'monitor_results':
        html += '<div class="think-item type-metric_results"><div class="think-label">📊 ' + (tp.type === 'metric_results' ? '诊断结果' : '监控数据') + '</div>' + renderDataTable(tp.content) + '</div>';
        break;
      case 'graph_results':
        html += '<div class="think-item"><div class="think-label">🕸️ 图谱结果</div><pre style="font-size:11px;max-height:200px;overflow:auto">' + escapeHtml(JSON.stringify(tp.content, null, 2)) + '</pre></div>';
        break;
      case 'action_items':
        html += renderActionItems(tp.content);
        break;
      case 'verification_results':
        html += renderVerificationCard(tp.content);
        break;
    }
  });

  // 答案内容 (Markdown 简单渲染)
  (md.contentBlocks || []).forEach(block => {
    if (block.type === 'answer' && block.content) {
      html += '<div class="answer-block">' + simpleMarkdown(block.content) + '</div>';
    }
  });

  msgEl.innerHTML = html;

  // 更新 header 中的时间
  const headerEl = currentMsg.querySelector('.msg-header-right');
  if (headerEl) headerEl.textContent = new Date().toLocaleTimeString();
}

// ================================================================
// 子渲染器
// ================================================================
function renderDataTable(content) {
  if (!content) return '<span style="font-size:12px;color:#9ca3af">无数据</span>';
  const data = content.data || (Array.isArray(content) ? content : null);
  if (!data || !Array.isArray(data) || data.length === 0) {
    return '<span style="font-size:12px;color:#9ca3af">' + (content.meta?.summary || '无数据') + '</span>';
  }
  const keys = Object.keys(data[0]);
  let t = '<table class="sql-table"><thead><tr>' + keys.map(k => '<th>' + escapeHtml(k) + '</th>').join('') + '</tr></thead><tbody>';
  data.forEach(row => {
    t += '<tr>' + keys.map(k => '<td>' + escapeHtml(String(row[k] ?? '')) + '</td>').join('') + '</tr>';
  });
  t += '</tbody></table>';
  return t;
}

function renderActionItems(content) {
  if (!content) return '';
  let h = '<div class="think-item type-action_items"><div class="think-label">⚡ 自愈变更建议</div>';

  // 新格式: actions 数组
  const actions = content.actions;
  if (actions && Array.isArray(actions) && actions.length > 0) {
    const riskLevel = content.risk_level || 'medium';
    const risk = riskMap[riskLevel] || riskMap.medium;
    h += '<div style="margin-bottom:8px"><span class="action-risk ' + risk.cls + '">' + risk.text + '</span>';
    h += ' <span style="font-size:12px;color:#6b7280">共 ' + actions.length + ' 个动作</span></div>';

    actions.forEach((act, i) => {
      h += '<div class="action-card">';
      h += '<div style="font-weight:600;margin-bottom:4px">#' + (i + 1) + ' ' + escapeHtml(act.action_context || '') + '</div>';
      h += '<div class="action-sql">' + escapeHtml(act.action_sql || '') + '</div>';
      if (act.impact) h += '<div style="font-size:12px;color:#6b7280">⚠️ 影响: ' + escapeHtml(act.impact) + '</div>';
      if (act.rollback_sql) h += '<div style="font-size:12px;color:#6b7280">🔄 回滚: <code>' + escapeHtml(act.rollback_sql) + '</code></div>';
      h += '</div>';
    });
  } else {
    // 旧格式
    const riskLevel = content.risk_level || 'medium';
    const risk = riskMap[riskLevel] || riskMap.medium;
    h += '<span class="action-risk ' + risk.cls + '">' + risk.text + '</span>';
    if (content.action_sql) h += '<div class="action-sql">' + escapeHtml(content.action_sql) + '</div>';
    if (content.impact) h += '<div style="font-size:12px;color:#6b7280;margin-top:4px">⚠️ 影响: ' + escapeHtml(content.impact) + '</div>';
    if (content.rollback_sql) h += '<div style="font-size:12px;color:#6b7280">🔄 回滚: <code>' + escapeHtml(content.rollback_sql) + '</code></div>';
  }
  h += '</div>';
  return h;
}

function renderVerificationCard(content) {
  if (!content) return '';
  const status = content.status || 'skipped';
  const st = statusMap[status] || { icon: '❓', text: status };
  let h = '<div class="think-item type-verification_results">';
  h += '<div class="think-label">🔍 验证结果: ' + st.text + '</div>';
  h += '<div class="verify-card ' + status + '">';

  // Header
  h += '<div class="verify-card-header"><span class="verify-icon">' + st.icon + '</span><span class="verify-status">' + st.text + '</span></div>';
  h += '<div class="verify-body">';

  // 指标变化表
  const pre = content.pre_snapshot || {};
  const post = content.post_snapshot || {};
  if (Object.keys(pre).length > 0) {
    h += '<div class="verify-section-title">📊 指标变化</div>';
    h += '<table class="verify-metrics-table"><thead><tr><th>指标</th><th>修复前</th><th>修复后</th><th>变化</th></tr></thead><tbody>';
    Object.keys(pre).forEach(name => {
      const preV = pre[name]?.value;
      const postV = (post[name] || {}).value;
      let change = '—';
      let changeCls = '';
      if (preV != null && postV != null) {
        const diff = postV - preV;
        change = (diff > 0 ? '+' : '') + diff.toFixed(1);
        changeCls = diff > 0 ? 'change-up' : 'change-down';
      }
      h += '<tr><td>' + escapeHtml(name) + '</td><td>' + (preV ?? '?') + '</td><td>' + (postV ?? '?') + '</td><td class="' + changeCls + '">' + change + '</td></tr>';
    });
    h += '</tbody></table>';
  }

  // 健康检查
  const health = content.health_check || {};
  if (Object.keys(health).length > 0) {
    h += '<div class="verify-section-title" style="margin-top:12px">🏥 健康检查</div>';
    h += '<table class="verify-metrics-table"><thead><tr><th>检查项</th><th>状态</th><th>详情</th></tr></thead><tbody>';
    Object.keys(health).forEach(name => {
      const ck = health[name] || {};
      const ok = ck.ok ? '<span class="health-ok">✅</span>' : '<span class="health-fail">❌</span>';
      h += '<tr><td>' + escapeHtml(name) + '</td><td>' + ok + '</td><td style="font-size:11px;color:#6b7280">' + escapeHtml(String(ck.detail || '')) + '</td></tr>';
    });
    h += '</tbody></table>';
  }

  // 总结
  if (content.summary) {
    h += '<div class="verify-section-title" style="margin-top:12px">📝 总结</div>';
    h += '<div style="font-size:13px;color:#374151">' + simpleMarkdown(content.summary) + '</div>';
  }

  h += '</div></div></div>';
  return h;
}

// ================================================================
// 简易 Markdown 渲染
// ================================================================
function simpleMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(String(text));
  // 代码块
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // 行内代码
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 粗体
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // 斜体
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  // 表格
  html = html.replace(/\|(.+)\|/g, function(match) {
    const cells = match.split('|').filter(c => c.trim());
    if (cells.every(c => /^[-:]+$/.test(c.trim()))) return ''; // 分隔行跳过
    const isHeader = match.includes('---');
    const tag = isHeader ? 'th' : 'td';
    return '<tr>' + cells.map(c => '<' + tag + '>' + c.trim() + '</' + tag + '>').join('') + '</tr>';
  });
  // 标题
  html = html.replace(/^### (.+)$/gm, '<h4 style="margin:12px 0 4px">$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3 style="margin:16px 0 6px">$1</h3>');
  html = html.replace(/^# (.+)$/gm, '<h2 style="margin:20px 0 8px">$1</h2>');
  // 换行
  html = html.replace(/\n\n/g, '<br><br>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function addUserMessage(text) {
  const msgs = document.getElementById('messages');
  // 清除空状态
  const empty = msgs.querySelector('.empty-state');
  if (empty) empty.remove();

  const el = document.createElement('div');
  el.className = 'msg';
  el.innerHTML = '<div class="msg-header"><span>👤 我</span><span class="msg-header-right">' + new Date().toLocaleTimeString() + '</span></div>' +
    '<div style="font-size:14px">' + escapeHtml(text) + '</div>';
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}

function addAgentPlaceholder() {
  const msgs = document.getElementById('messages');
  const empty = msgs.querySelector('.empty-state');
  if (empty) empty.remove();

  const el = document.createElement('div');
  el.className = 'msg';
  el.innerHTML = '<div class="msg-header"><span>🤖 智能体</span><span class="msg-header-right">' + new Date().toLocaleTimeString() + '</span></div>' +
    '<div class="msg-body"></div>';
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return el;
}

function clearMessages() {
  document.getElementById('messages').innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><p>填入配置，输入运维问题，点击发送</p></div>';
  currentMsg = null;
  currentMsgData = {};
}

function setStatus(text, type) {
  const bar = document.getElementById('statusBar');
  bar.style.display = 'flex';
  bar.className = 'status-bar status-' + type;
  bar.innerHTML = '<span class="status-dot"></span>' + escapeHtml(text);
}
