# 端点只引用进程；默认 URL 根据进程端口生成，audience 使用 service_name。
[endpoints]
knowledge_core = "knowledge_core_api"
knowledge_retrieval_app = "knowledge_retrieval_app_api"
km_asset_app = "km_asset_app_api"
agent_runtime = "agent_runtime_api"
data_query = "data_query_api"
aiops = "aiops_api"
aiops_db_executor = "aiops_db_executor"
model_embedding = "model_embedding"
model_llm = "model_llm"
model_visual = "model_visual"
model_vlm = "model_vlm"
model_ocr = "model_ocr"

[dependencies.main_api.knowledge_core]
