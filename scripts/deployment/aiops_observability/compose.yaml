name: kbot-aiops-observability

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - observability

services:
  prometheus:
    <<: *service-defaults
    image: ${PROMETHEUS_IMAGE}
    profiles: [metrics]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    environment:
      AIOPS_PROMETHEUS_CONFIG_REVISION: ${AIOPS_PROMETHEUS_CONFIG_REVISION}
    volumes:
      - ${AIOPS_STACK_STATE_DIR}/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    group_add: ["${AIOPS_SECRET_GID}"]
    expose: ["9090"]
    healthcheck:
      test: [CMD, promtool, check, ready]
      interval: 15s
      timeout: 5s
      retries: 12
    depends_on:
      alertmanager:
        condition: service_healthy

  alertmanager:
    <<: *service-defaults
    image: ${ALERTMANAGER_IMAGE}
    profiles: [metrics]
    environment:
      AIOPS_ALERTMANAGER_CONFIG_REVISION: ${AIOPS_ALERTMANAGER_CONFIG_REVISION}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=${ALERTMANAGER_RETENTION:-120h}
    volumes:
      - ${AIOPS_STACK_STATE_DIR}/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    group_add: ["${AIOPS_SECRET_GID}"]
    networks: [observability, outbound]
    expose: ["9093"]
    healthcheck:
      test: [CMD, amtool, --alertmanager.url=http://127.0.0.1:9093, config, show]
      interval: 15s
      timeout: 5s
      retries: 12

  loki:
    <<: *service-defaults
    image: ${LOKI_IMAGE}
    profiles: [logs]
    command: [-config.file=/etc/loki/loki.yml]
    environment:
      AIOPS_LOKI_CONFIG_REVISION: ${AIOPS_LOKI_CONFIG_REVISION:-disabled}
    volumes:
      - ${AIOPS_STACK_STATE_DIR}/loki:/etc/loki:ro
      - loki-data:/loki
    group_add: ["${AIOPS_SECRET_GID}"]
    expose: ["3100"]
    healthcheck:
      test: [CMD, /usr/bin/loki, -config.file=/etc/loki/loki.yml, -verify-config=true]
      interval: 15s
      timeout: 5s
      retries: 12

  alloy:
    <<: *service-defaults
    image: ${ALLOY_IMAGE}
    profiles: [logs]
    command:
      - run
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    environment:
      AIOPS_LOKI_PUSH_URL: ${AIOPS_LOKI_PUSH_URL:-http://loki:3100/loki/api/v1/push}
      AIOPS_LOKI_TENANT: ${AIOPS_LOKI_TENANT:-kbot}
      AIOPS_ALLOY_CONFIG_REVISION: ${AIOPS_ALLOY_CONFIG_REVISION:-disabled}
    volumes:
      - ./configuration/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    secrets:
      - source: loki-authorization
        target: loki_authorization
    group_add: ["${AIOPS_SECRET_GID}"]
    networks: [observability, outbound]
    expose: ["12345"]

  grafana:
    <<: *service-defaults
    image: ${GRAFANA_IMAGE}
    profiles: [dashboard]
    environment:
      GF_SECURITY_ADMIN_USER__FILE: /run/secrets/grafana_admin_user
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/oracle-overview.json
    volumes:
      - ./configuration/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configuration/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets:
      - source: grafana-admin-user
        target: grafana_admin_user
      - source: grafana-admin-password
        target: grafana_admin_password
    group_add: ["${AIOPS_SECRET_GID}"]
    expose: ["3000"]

  node-exporter:
    <<: *service-defaults
    image: ${NODE_EXPORTER_IMAGE}
    profiles: [host]
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    expose: ["9100"]

networks:
  observability:
    internal: ${AIOPS_INTERNAL_NETWORK:-true}
  outbound:

secrets:
  loki-authorization:
    file: ${AIOPS_STACK_SECRET_DIR}/loki_authorization
  grafana-admin-user:
    file: ${AIOPS_STACK_SECRET_DIR}/grafana_admin_user
  grafana-admin-password:
    file: ${AIOPS_STACK_SECRET_DIR}/grafana_admin_password

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
