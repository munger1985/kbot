# 发布Central维护端口。除Grafana可显式指定管理网IPv4外，其余端口仅绑定本机。
services:
  prometheus:
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
  alertmanager:
    ports: ["127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"]
  loki:
    ports: ["127.0.0.1:${LOKI_PORT:-3100}:3100"]
  grafana:
    ports: ["${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"]
