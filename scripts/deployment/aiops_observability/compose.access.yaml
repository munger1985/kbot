# 发布 Central 维护端口；默认仅绑定本机。
services:
  prometheus:
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    networks: [observability, management]
  alertmanager:
    ports: ["127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"]
  loki:
    ports: ["${LOKI_BIND_ADDRESS:-127.0.0.1}:${LOKI_PORT:-3100}:3100"]
    networks: [observability, management]
networks:
  management:
