apiVersion: 1
prune: true
datasources:
  - name: Prometheus
    uid: kbot-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: kbot-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
  - name: Alertmanager
    uid: kbot-alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
