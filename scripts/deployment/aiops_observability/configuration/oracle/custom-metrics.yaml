# KBot AIOps补充Oracle指标。
# SQL必须保持低基数、无分号，并且只能读取已审核的动态性能视图。

metrics:
  - context: kbot_cpu
    metricsdesc:
      utilization_percent: 当前PDB最近一分钟相对数据库主机总CPU容量的平均使用率百分比。
    request: |-
      SELECT utilization_percent
      FROM (
        SELECT ROUND(avg_cpu_utilization, 6) AS utilization_percent
        FROM v$rsrcpdbmetric
        WHERE intsize_csec > 0
        ORDER BY end_time DESC
      )
      WHERE ROWNUM = 1

  - context: kbot_errors
    metricsdesc:
      total: Oracle实例启动以来SQL解析失败累计次数。
    metricstype:
      total: counter
    request: |-
      SELECT value AS total
      FROM v$sysstat
      WHERE name = 'parse count (failures)'
