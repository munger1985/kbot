# KBot AIOps补充Oracle指标。
# SQL必须保持低基数、无分号，并且只能读取已审核的动态性能视图。

metrics:
  - context: kbot_cpu
    metricsdesc:
      utilization_percent: 当前PDB最近一分钟相对数据库主机总CPU容量的平均使用率百分比。
    request: |-
      SELECT utilization_percent
      FROM (
        SELECT ROUND(avg_cpu_utilization, 6) AS utilization_percent
        FROM v$rsrcpdbmetric
        WHERE intsize_csec > 0
        ORDER BY end_time DESC
      )
      WHERE ROWNUM = 1

  - context: kbot_connection
    metricsdesc:
      current_sessions: 当前PDB会话数。
      limit_sessions: 当前PDB有效会话上限；未配置MAX_PDB_SESSIONS时使用实例SESSIONS上限。
    request: |-
      WITH parameter_values AS (
        SELECT
          MAX(CASE WHEN name = 'max_pdb_sessions' THEN TO_NUMBER(value) END) AS max_pdb_sessions,
          MAX(CASE WHEN name = 'sessions' THEN TO_NUMBER(value) END) AS instance_sessions
        FROM v$parameter
        WHERE name IN ('max_pdb_sessions', 'sessions')
      ), session_count AS (
        SELECT COUNT(*) AS current_sessions
        FROM v$session
      )
      SELECT
        session_count.current_sessions,
        CASE
          WHEN NVL(parameter_values.max_pdb_sessions, 0) > 0
          THEN parameter_values.max_pdb_sessions
          ELSE parameter_values.instance_sessions
        END AS limit_sessions
      FROM parameter_values
      CROSS JOIN session_count
      WHERE CASE
        WHEN NVL(parameter_values.max_pdb_sessions, 0) > 0
        THEN parameter_values.max_pdb_sessions
        ELSE parameter_values.instance_sessions
      END > 0

  - context: kbot_errors
    metricsdesc:
      total: Oracle实例启动以来SQL解析失败累计次数。
    metricstype:
      total: counter
    request: |-
      SELECT value AS total
      FROM v$sysstat
      WHERE name = 'parse count (failures)'
