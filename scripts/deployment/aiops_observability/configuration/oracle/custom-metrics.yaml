# KBot AIOps补充Oracle指标。
# SQL必须保持低基数、无分号，并且只能读取已审核的动态性能视图。

metrics:
  - context: kbot_cpu
    metricsdesc:
      utilization_percent: 当前PDB最近一分钟相对数据库主机总CPU容量的平均使用率百分比。
    ignorezeroresult: true
    request: |-
      SELECT utilization_percent
      FROM (
        SELECT ROUND(avg_cpu_utilization, 6) AS utilization_percent
        FROM v$rsrcpdbmetric
        WHERE intsize_csec > 0
          AND end_time >= SYSDATE - 2 / 1440
        ORDER BY end_time DESC
      )
      WHERE ROWNUM = 1

  - context: kbot_cpu_time
    metricsdesc:
      seconds_total: 当前容器累计DB CPU秒数，用于无资源管理器采样时计算真实CPU使用率。
      host_cpu_count: 数据库主机逻辑CPU数量，用于统一CPU使用率分母。
    metricstype:
      seconds_total: counter
    request: |-
      SELECT t.value / 1000000 AS seconds_total, o.value AS host_cpu_count
      FROM v$sys_time_model t
      CROSS JOIN v$osstat o
      WHERE t.stat_name = 'DB CPU'
        AND o.stat_name = 'NUM_CPUS'
        AND o.value > 0

  - context: kbot_wait
    labels: [wait_class]
    metricsdesc:
      seconds_total: 当前容器非空闲等待累计秒数，必须通过rate计算窗口等待速率。
    metricstype:
      seconds_total: counter
    ignorezeroresult: true
    request: |-
      SELECT wait_class, SUM(time_waited_micro) / 1000000 AS seconds_total
      FROM v$system_event
      WHERE wait_class <> 'Idle'
      GROUP BY wait_class

  - context: kbot_source
    labels: [source]
    metricsdesc:
      row_count: 本轮原生视图行数；0只表示无数据，不表示数据库健康，也不等同于查询失败。
    request: |-
      SELECT 'resource' AS source, COUNT(*) AS row_count FROM v$resource_limit
      UNION ALL
      SELECT 'wait_time' AS source, COUNT(*) AS row_count FROM v$waitclassmetric
      UNION ALL
      SELECT 'cpu_window' AS source, COUNT(*) AS row_count
      FROM v$rsrcpdbmetric
      WHERE intsize_csec > 0 AND end_time >= SYSDATE - 2 / 1440

  - context: kbot_connection
    metricsdesc:
      current_sessions: 当前PDB会话数。
      limit_sessions: 当前PDB有效会话上限；未配置MAX_PDB_SESSIONS时使用实例SESSIONS上限。
    request: |-
      WITH parameter_values AS (
        SELECT
          MAX(CASE WHEN name = 'max_pdb_sessions' THEN TO_NUMBER(value) END) AS max_pdb_sessions,
          MAX(CASE WHEN name = 'sessions' THEN TO_NUMBER(value) END) AS instance_sessions
        FROM v$parameter
        WHERE name IN ('max_pdb_sessions', 'sessions')
      ), session_count AS (
        SELECT COUNT(*) AS current_sessions
        FROM v$session
      )
      SELECT
        session_count.current_sessions,
        CASE
          WHEN NVL(parameter_values.max_pdb_sessions, 0) > 0
          THEN parameter_values.max_pdb_sessions
          ELSE parameter_values.instance_sessions
        END AS limit_sessions
      FROM parameter_values
      CROSS JOIN session_count
      WHERE CASE
        WHEN NVL(parameter_values.max_pdb_sessions, 0) > 0
        THEN parameter_values.max_pdb_sessions
        ELSE parameter_values.instance_sessions
      END > 0

  - context: kbot_errors
    metricsdesc:
      total: Oracle实例启动以来SQL解析失败累计次数。
    metricstype:
      total: counter
    request: |-
      SELECT value AS total
      FROM v$sysstat
      WHERE name = 'parse count (failures)'
