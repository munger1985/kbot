collector_name: aiops_database_metric_row_postgresql_v1
metrics:
  - metric_name: aiops_database_active_sessions
    type: gauge
    help: "同一原生查询的活跃会话与身份；只归属本指标，不证明其他Exporter或完整历史。"
    key_labels: [metric_identity_version, database_type, system_identifier, database_oid, instance_started_at]
    values: [active_sessions]
    query: |
      SELECT '1' AS metric_identity_version, 'POSTGRESQL' AS database_type,
             control.system_identifier::text AS system_identifier,
             (SELECT oid::text FROM pg_catalog.pg_database WHERE datname=pg_catalog.current_database()) AS database_oid,
             to_char(pg_catalog.pg_postmaster_start_time() AT TIME ZONE 'UTC',
                     'YYYY-MM-DD"T"HH24:MI:SS.US') || '+00:00' AS instance_started_at,
             (SELECT count(*) FROM pg_catalog.pg_stat_activity
              WHERE datid=(SELECT oid FROM pg_catalog.pg_database WHERE datname=pg_catalog.current_database())
                AND state='active' AND pid<>pg_catalog.pg_backend_pid()) AS active_sessions
      FROM pg_catalog.pg_control_system() AS control
