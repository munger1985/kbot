<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>知识检索 · 知识库管理</title>
  <link rel="stylesheet" href="./css/knowledge.css?v=20261105_3">
  <link rel="stylesheet" href="./css/ammolite-shared.css?v=20261105_3">
  <link rel="stylesheet" href="./css/reference-knowledge-cores.css?v=20261105_3">
  <link rel="stylesheet" href="./css/alignment.css?v=20261105_3">
</head>
<body class="business-app-knowledge_retrieval" data-page="knowledge-cores">
<main class="knowledge-main platform-home-page knowledge-retrieval-page">
<header class="platform-home-header"><div class="login-brand"><span class="brand-mark">K</span><strong>知识库管理</strong></div><a class="text-button" href="./knowledge.html">返回知识检索</a></header><section class="platform-home-hero"><div><p class="eyebrow">当前业务空间</p><h1>知识库管理</h1><p>知识库只在当前业务空间内创建和治理；模型仅可从平台已启用目录中选择。</p></div></section>
<section class="section-toolbar"><p>上传和审核在日常业务入口完成；解析模型绑定在知识库配置中维护。</p><button class="primary-button" type="button" data-open-dialog="kc-dialog">新建知识库</button></section>
<section class="table-card"><div class="table-scroll"><table><thead><tr><th>名称</th><th>说明</th><th>资料包</th><th>状态</th><th>操作</th></tr></thead><tbody id="kc-rows"><tr><td colspan="5" class="empty-cell">正在读取知识库…</td></tr></tbody></table></div></section>
</main>
<dialog class="knowledge-dialog knowledge-drawer admin-drawer" id="kc-dialog">
  <form id="kc-form">
    <div class="knowledge-dialog-head"><h2 id="kc-dialog-title">新建知识库</h2><button class="knowledge-close" type="button" data-close-dialog="kc-dialog" aria-label="关闭">×</button></div>
    <div class="knowledge-dialog-body">
      <input id="kc-id" type="hidden">
      <input id="kc-row-version" type="hidden">
      <div class="knowledge-form-grid">
        <div class="knowledge-field"><label for="kc-domain">所属 Domain</label><input id="kc-domain" readonly></div>
        <div class="knowledge-field"><label for="kc-name">名称</label><input id="kc-name" required maxlength="120" placeholder="例如：销售知识库"></div>
        <div class="knowledge-field full"><label for="kc-description">说明</label><textarea id="kc-description" maxlength="1000" placeholder="说明此知识库覆盖的资料范围。"></textarea></div>
        <div class="knowledge-field"><label for="kc-security">默认安全级别</label><select id="kc-security"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
        <div class="knowledge-field"><label for="kc-parser-ocr">OCR 解析模型</label><select id="kc-parser-ocr" required><option value="">等待模型目录接入</option></select></div>
        <div class="knowledge-field"><label for="kc-parser-vlm">视觉解析模型（可选）</label><select id="kc-parser-vlm"><option value="">不绑定</option></select></div>
        <div class="knowledge-field"><label for="kc-parser-llm">LLM 解析模型（可选）</label><select id="kc-parser-llm"><option value="">不绑定</option></select></div>
        <div class="knowledge-field"><label for="kc-embedding">文本 Embedding</label><select id="kc-embedding" required><option value="">等待模型目录接入</option></select></div>
        <div class="knowledge-field full"><label for="kc-visual-embedding">视觉 Embedding（可选）</label><select id="kc-visual-embedding"><option value="">不绑定</option></select></div>
      </div>
      <div class="knowledge-notice">Knowledge Core 归属当前 Token 中的 Domain。自动解析必须绑定 OCR；LLM 解析模型用于结构修复和 App 预分析，不用于生成问答。</div>
    </div>
    <div class="knowledge-dialog-foot"><button type="button" data-close-dialog="kc-dialog">取消</button><button class="primary" id="kc-submit" type="submit">创建</button></div>
  </form>
</dialog>
<script src="../runtime-config.js"></script>
<script src="./js/knowledge-auth.js?v=20261105_3"></script>
<script src="./js/knowledge-api.js?v=20261105_3"></script>
<script src="./js/knowledge-shell.js?v=20261105_3"></script>
<script src="./js/knowledge-knowledge-cores.js?v=20261105_3"></script>
</body>
</html>
