<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>知识检索 · Agent 问答</title>
  <link rel="stylesheet" href="./css/knowledge.css?v=20261105_3">
  <link rel="stylesheet" href="./css/ammolite-shared.css?v=20261120">
  <link rel="stylesheet" href="./css/reference-knowledge.css?v=20261123_answer_stream">
  <link rel="stylesheet" href="./css/alignment.css?v=20261122_chat">
  <link rel="stylesheet" href="./css/knowledge-agent-workbench.css?v=20261123_citation_drawers">
</head>
<body class="business-app-knowledge_retrieval" data-page="knowledge">
<main class="knowledge-main platform-home-page agent-chat-page knowledge-retrieval-page knowledge-chat-page">
  <header class="app-page-head"><div><p class="eyebrow">知识检索工作区</p><h1>Agent 问答</h1><p>围绕当前知识 Agent 开展连续问答，并保留完整会话上下文。</p></div></header>
  <section class="agent-chat-workspace knowledge-chat-workspace is-session-collapsed" id="knowledge-workspace">
    <aside id="knowledge-retrieval-sessions" class="agent-chat-session-rail knowledge-session-sidebar" aria-label="会话历史">
      <header class="knowledge-session-header">
        <div class="knowledge-session-actions">
          <button class="icon-button agent-chat-session-toggle" id="knowledge-session-toggle" type="button" aria-label="展开会话列表" title="展开会话列表" aria-controls="knowledge-retrieval-sessions" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14 M5 12h14 M5 17h14"/></svg></button>
          <button class="secondary-button knowledge-session-create" id="knowledge-new-conversation" type="button" aria-label="新增会话" title="新增会话" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新增会话</span></button>
        </div>
        <div class="knowledge-session-meta"><strong>会话</strong><span id="knowledge-session-count">0 条记录</span></div>
      </header>
      <nav class="conversation-list knowledge-conversation-list" id="knowledge-conversation-list" aria-label="历史会话"></nav>
      <footer class="agent-chat-session-toggle-row knowledge-session-refresh"><button class="text-button" id="knowledge-refresh" type="button">刷新</button></footer>
    </aside>
    <section class="agent-chat-conversation knowledge-conversation-panel">
      <header class="agent-chat-conversation-head knowledge-conversation-header">
        <label class="control-field knowledge-agent-picker"><span class="visually-hidden">知识 Agent</span><select id="knowledge-agent" aria-label="当前 Agent" disabled><option value="">正在读取 Agent</option></select><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></label>
      </header>
      <div class="agent-chat-transcript knowledge-message-viewport" id="knowledge-chat-stream" aria-live="polite"></div>
      <footer class="agent-chat-composer knowledge-composer-wrap">
        <div class="knowledge-stream-progress" id="knowledge-progress" role="status" hidden>等待处理</div>
        <input id="knowledge-query-images" type="file" multiple accept="image/png,image/jpeg,image/webp" hidden>
        <div class="knowledge-chat-attachments" id="knowledge-chat-attachments" hidden><span id="knowledge-chat-attachment-names"></span><button class="text-button" type="button" id="knowledge-clear-images">移除图片</button></div>
        <form class="agent-chat-composer-row knowledge-composer" id="knowledge-form">
          <button class="icon-button agent-chat-composer-action knowledge-composer-attachment" id="knowledge-add-images" type="button" aria-label="添加查询图片" title="查询图片（最多 4 张，合计 8 MiB）" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.6 12 21a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7 2.8 2.8 0 0 1-2.8 2.8l-8.5 8.5"/></svg></button>
          <label class="agent-chat-composer-input"><span class="visually-hidden">问题</span><textarea class="chat-composer-textarea" rows="1" id="knowledge-input" required maxlength="32000" placeholder="输入问题，Enter 发送" disabled></textarea></label>
          <button class="primary-button agent-chat-composer-action knowledge-send-button" type="submit" disabled id="knowledge-send" aria-label="发送问题" title="发送问题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z M22 2 11 13"/></svg></button>
        </form>
        <div class="agent-chat-composer-hint"><span id="knowledge-input-hint">请选择已启用 Agent。</span><small>Enter 发送 · Shift + Enter 换行</small></div>
      </footer>
    </section>
  </section>
</main>

<dialog class="knowledge-dialog knowledge-reference-dialog knowledge-drawer admin-drawer-wide" id="knowledge-reference-dialog" aria-labelledby="knowledge-reference-title">
  <header class="admin-drawer-header">
    <div>
      <h2 id="knowledge-reference-title">文档引用</h2>
      <p class="dialog-subtitle" id="knowledge-reference-meta"></p>
    </div>
    <button class="icon-button" type="button" data-close-reference aria-label="关闭资料预览">×</button>
  </header>
  <div class="knowledge-dialog-body" id="knowledge-reference-body"></div>
</dialog>
<dialog class="knowledge-dialog knowledge-drawer knowledge-retrieval-dialog" id="knowledge-retrieval-dialog" aria-labelledby="knowledge-retrieval-heading">
  <header class="admin-drawer-header">
    <div><h2 id="knowledge-retrieval-heading">检索结果</h2><p class="dialog-subtitle">检索命中不等于回答引用。可逐项展开查看证据片段。</p></div>
    <button class="icon-button" type="button" data-close-retrieval aria-label="关闭检索结果">×</button>
  </header>
  <div class="knowledge-dialog-body" id="knowledge-retrieval-body"></div>
</dialog>

<script src="../runtime-config.js"></script>
<script src="./js/knowledge-auth.js?v=20261105_3"></script>
<script src="./js/knowledge-api.js?v=20261120"></script>
<script src="./js/knowledge-shell.js?v=20261121_files_governance"></script>
<script src="../vendor/marked.umd.js?v=18.0.9"></script>
<script src="../vendor/purify.min.js?v=3.4.13"></script>
<script src="../shared/kbot-markdown.js?v=20260827_1"></script>
<script src="./js/knowledge-knowledge.js?v=20261123_answer_stream"></script>
</body>
</html>
