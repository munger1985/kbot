<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识检索 · 知识库文件</title>
<link rel="stylesheet" href="./css/knowledge.css?v=20261105_3"><link rel="stylesheet" href="./css/ammolite-shared.css?v=20261105_3"><link rel="stylesheet" href="./css/reference-files.css?v=20261105_3"><link rel="stylesheet" href="./css/alignment.css?v=20261105_3"></head>
<body class="business-app-knowledge_retrieval" data-page="files"><main class="knowledge-main platform-home-page knowledge-retrieval-page knowledge-library-files-page"><header class="platform-home-header"><div class="login-brand"><span class="brand-mark">K</span><strong>知识库文件</strong></div><a class="text-button" href="./knowledge.html">返回知识检索</a></header>
<section class="platform-home-hero"><div><p class="eyebrow">知识内容</p><h1>知识库文件</h1><p>查看当前知识库中的文件、原始内容和处理记录。</p></div></section>
<section class="table-card"><header class="knowledge-list-toolbar"><label class="control-field"><span class="field-label">知识库</span><select id="library-collection" required aria-label="知识库"><option value="">正在读取知识库…</option></select></label>
<label class="search-field"><span class="visually-hidden">搜索文件</span><input id="library-query" type="search" placeholder="搜索文件名或资料包"></label>
<label class="control-field"><span class="field-label">文件状态</span><select id="library-status"><option value="">全部状态</option><option value="READY">可检索</option><option value="PARSING">解析中</option><option value="INDEXING">建立索引</option><option value="FAILED">失败</option><option value="SOURCE_UNAVAILABLE">源文件不可用</option></select></label>
<button class="secondary-button" id="library-refresh" type="button">查询</button></header><div class="table-scroll"><table><thead><tr><th>文件</th><th>所属资料包</th><th>类型 / 大小</th><th>状态</th><th>入库时间</th><th>操作</th></tr></thead><tbody id="library-rows"><tr><td colspan="6" class="empty-cell">正在读取…</td></tr></tbody></table></div><footer class="table-pagination" id="library-pagination" hidden><div class="table-pagination-summary"><span id="library-page-summary"></span><label class="table-pagination-size">每页<select id="library-page-size"><option value="20">20</option><option value="50">50</option><option value="100">100</option></select></label></div><div class="table-pagination-controls"><button type="button" class="table-pagination-button" id="library-prev" aria-label="上一页">‹</button><button type="button" class="table-pagination-button active" id="library-page" aria-current="page">1</button><button type="button" class="table-pagination-button" id="library-next" aria-label="下一页">›</button></div></footer></section></main><dialog class="knowledge-dialog knowledge-drawer admin-drawer" id="library-detail"><header class="admin-drawer-header"><div><p class="eyebrow">资料详情</p><h2 id="library-detail-title"></h2></div><button class="icon-button" type="button" data-close-dialog="library-detail" aria-label="关闭资料详情">×</button></header><div class="admin-drawer-body" id="library-detail-body"></div><footer class="admin-drawer-footer"><button class="secondary-button" type="button" data-close-dialog="library-detail">关闭</button></footer></dialog>
<dialog class="knowledge-dialog knowledge-drawer admin-drawer admin-drawer-compact" id="library-reject"><header class="admin-drawer-header"><div><p class="eyebrow">退回资料</p><h2 id="library-reject-title"></h2><p>退回后资料不会进入处理流程，请说明需要修正的内容。</p></div><button class="icon-button" type="button" data-close-dialog="library-reject" aria-label="关闭退回资料">×</button></header><form id="library-reject-form" class="quick-create-form"><label class="control-field"><span class="field-label">退回原因</span><textarea id="library-reject-reason" rows="6" required maxlength="2000" placeholder="说明缺失、错误或需要重新提交的具体内容"></textarea></label><footer class="admin-drawer-footer"><button class="secondary-button" type="button" data-close-dialog="library-reject">取消</button><button class="danger-button" type="submit">确认退回</button></footer></form></dialog>
<script src="../runtime-config.js"></script><script src="./js/knowledge-auth.js?v=20261105_3"></script><script src="./js/knowledge-api.js?v=20261105_3"></script><script src="./js/knowledge-shell.js?v=20261105_3"></script><script src="./js/knowledge-library.js?v=20261105_3"></script></body></html>
