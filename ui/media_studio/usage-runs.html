<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>多媒体创作工作台 · 用量与运行记录</title>
  <link rel="stylesheet" href="./css/media.css">
</head>
<body data-page="usage-runs">
<main class="media-main">
  <header class="media-page-head">
    <div>
      <h1>用量与运行记录</h1>
      <p>会话、X Search 与图片生成分别记录 Run、状态、模型快照与安全用量摘要；SSE 不是状态事实来源。</p>
    </div>
    <div class="media-actions"><button id="runs-refresh" type="button">刷新</button></div>
  </header>
  <section class="media-grid">
    <article class="media-panel span-12">
      <div class="media-panel-head">
        <div><h2>运行记录</h2><p>只显示当前用户在当前 Domain 有权查看的运行。</p></div>
        <div class="media-run-types">
          <span><i class="knowledge"></i> 知识问答</span>
          <span><i class="search"></i> X Search</span>
          <span><i class="image"></i> 文生图</span>
        </div>
      </div>
      <div class="media-filter-bar">
        <div class="media-field compact"><label for="run-type">类型</label>
          <select id="run-type">
            <option value="">全部类型</option>
            <option value="X_SEARCH">X Search</option>
            <option value="IMAGE_GENERATION">文生图</option>
          </select>
        </div>
        <div class="media-field compact"><label for="run-status">状态</label>
          <select id="run-status">
            <option value="">全部状态</option>
            <option value="RUNNING">RUNNING</option>
            <option value="COMPLETED">COMPLETED</option>
            <option value="FAILED">FAILED</option>
            <option value="REJECTED">REJECTED</option>
          </select>
        </div>
        <div class="media-field"><label for="run-keyword">Run ID 或请求标识</label><input id="run-keyword" placeholder="不支持按 Prompt 明文跨 Domain 检索"></div>
        <button type="button" id="runs-filter">筛选</button>
      </div>
      <div class="media-table-wrap">
        <table class="media-table">
          <thead><tr><th>Run</th><th>类型</th><th>状态</th><th>模型</th><th>用量摘要</th><th>开始时间</th><th>操作</th></tr></thead>
          <tbody id="run-rows">
            <tr><td colspan="7"><div class="media-empty"><div><strong>尚无可显示的运行</strong><p>API 接入后，可在此恢复终态、打开引用或资产详情；不会将供应商原始账单、Secret 或完整 Prompt 直接作为列表字段返回。</p></div></div></td></tr>
          </tbody>
        </table>
      </div>
    </article>
  </section>
</main>
<script src="../runtime-config.js"></script>
<script src="./js/media-auth.js"></script>
<script src="./js/media-api.js"></script>
<script src="./js/media-shell.js"></script>
<script src="./js/media-management.js"></script>
</body>
</html>
