<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KM 智能问答</title><link rel="stylesheet" href="./css/km.css?v=20260827_1"><link rel="stylesheet" href="./css/km-chat-markdown.css?v=20260824_1"></head>
<body data-page="chat"><main class="km-main"><header class="km-page-head"><div><h1>智能问答</h1><p>面向 KM Asset 的问文与问数统一会话；引用先展示 Asset，再按需打开附件。</p></div><div class="km-actions"><select id="chat-agent" aria-label="当前 Agent"></select><button id="new-conversation" class="primary">新建会话</button></div></header>
  <section class="km-split"><aside class="km-panel"><div class="km-panel-head"><div><h2>最近会话</h2><p>当前 KM Agent 范围</p></div><button id="refresh-conversations" class="small">刷新</button></div><ul id="conversation-list" class="km-list"></ul></aside>
  <article class="km-panel"><div class="km-panel-head"><div><h2 id="conversation-title">请选择或创建会话</h2><p id="conversation-meta">会话由 Agent Runtime 持久化</p></div></div><div id="chat-stream" class="km-chat-stream"></div><div id="chat-progress" class="km-progress" hidden>等待处理</div><form id="chat-form" class="km-composer"><textarea id="chat-input" required maxlength="32000" placeholder="询问文档内容，或对 Asset 元数据进行统计分析…"></textarea><button id="send-message" class="primary" type="submit">发送</button></form></article></section>
</main><dialog id="reference-dialog"><div class="km-dialog-head"><h2 id="reference-title">Asset 引用</h2><button class="km-close" data-close aria-label="关闭">×</button></div><div class="km-dialog-body"><p id="reference-meta" class="km-help"></p><p id="reference-description">引用首先展示 Asset；附件可在 Asset 下单独打开。</p><div id="reference-asset-preview" class="km-reference-asset-preview" hidden></div></div></dialog>
<script src="../runtime-config.js"></script><script src="../shared/kbot-api-client.js?v=20260813_5"></script><script src="../shared/kbot-km-auth-v2.js?v=20260818_2"></script><script src="../vendor/marked.umd.js?v=18.0.9"></script><script src="../vendor/purify.min.js?v=3.4.13"></script><script src="../shared/kbot-markdown.js?v=20260819_3"></script><script src="../shared/kbot-shell.js?v=20260824_1"></script><script src="./js/km-chat-v6.js?v=20260827_1"></script></body></html>
