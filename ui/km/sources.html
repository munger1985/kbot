<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KM 数据来源</title><link rel="stylesheet" href="./css/km.css"></head>
<body data-page="sources"><main class="km-main">
  <header class="km-page-head"><div><h1>数据来源</h1><p>管理 MetaDB、SharePoint 与固定 assets Collection 的映射及专用问数模型。</p></div><div class="km-actions"><button id="refresh-sources">刷新</button><button id="new-source" class="primary">新建来源</button></div></header>
  <section class="km-panel"><div class="km-table-wrap"><table class="km-table"><thead><tr><th>来源</th><th>MetaDB</th><th>Collection</th><th>状态</th><th>轮询</th><th>版本</th><th>操作</th></tr></thead><tbody id="source-rows"></tbody></table></div></section>
</main>
<dialog id="source-dialog"><form id="source-form"><div class="km-dialog-head"><h2>新建数据来源</h2><button type="button" class="km-close" data-close aria-label="关闭">×</button></div><div class="km-dialog-body"><div class="km-form-grid">
  <div class="km-field span-12"><label>显示名称</label><input name="display_name" required maxlength="256"></div>
  <div class="km-field span-12"><label>MetaDB Endpoint</label><input name="metadb_endpoint" type="url" required></div><div class="km-field span-6"><label>MetaDB 用户名</label><input name="metadb_username" required></div><div class="km-field span-6"><label>MetaDB 密码</label><input name="metadb_password" type="password" required autocomplete="new-password"></div>
  <div class="km-field span-4"><label>SharePoint Tenant ID</label><input name="tenant_id" required></div><div class="km-field span-4"><label>SharePoint Client ID</label><input name="client_id" required></div><div class="km-field span-4"><label>SharePoint Client Secret</label><input name="client_secret" type="password" required autocomplete="new-password"></div>
  <div class="km-field span-8"><label>SharePoint Site Path</label><input name="sharepoint_site_path" required></div><div class="km-field"><label>轮询间隔（秒）</label><input name="poll_interval_seconds" type="number" min="10" max="86400" value="60" required></div><div class="km-field"><label>批次大小</label><input name="batch_size" type="number" min="1" max="1000" value="100" required></div>
  <p class="km-help span-12">文档固定写入 km_portal Domain 的 assets Collection；凭据仅随本次请求提交，页面不会将其写入浏览器存储。</p>
</div></div><div class="km-dialog-foot"><button type="button" data-close>取消</button><button id="save-source" class="primary" type="submit">创建</button></div></form></dialog>
<dialog id="data-model-dialog"><div class="km-dialog-head"><h2>KM 固定数据模型</h2><button class="km-close" data-close aria-label="关闭">×</button></div><div class="km-dialog-body"><pre id="data-model-json" class="km-json"></pre></div><div class="km-dialog-foot"><button id="reconcile-data-model" class="primary">重新对账</button></div></dialog>
<dialog id="source-edit-dialog"><form id="source-edit-form"><div class="km-dialog-head"><h2>修改数据来源</h2><button type="button" class="km-close" data-close aria-label="关闭">×</button></div><div class="km-dialog-body"><div class="km-form-grid">
  <input name="source_id" type="hidden"><input name="expected_row_version" type="hidden">
  <div class="km-field span-6"><label>显示名称</label><input name="display_name" required maxlength="256"></div><div class="km-field span-6"><label>MetaDB Endpoint</label><input name="metadb_endpoint" type="url" required></div>
  <div class="km-field span-8"><label>SharePoint Site Path</label><input name="sharepoint_site_path" required></div><div class="km-field"><label>轮询间隔（秒）</label><input name="poll_interval_seconds" type="number" min="10" max="86400" required></div><div class="km-field"><label>批次大小</label><input name="batch_size" type="number" min="1" max="1000" required></div>
  <p class="km-help span-12">以下凭据留空表示保持原值；填写时必须完整填写同一组全部字段。</p>
  <div class="km-field span-6"><label>新 MetaDB 用户名</label><input name="metadb_username" autocomplete="off"></div><div class="km-field span-6"><label>新 MetaDB 密码</label><input name="metadb_password" type="password" autocomplete="new-password"></div>
  <div class="km-field span-4"><label>新 Tenant ID</label><input name="tenant_id" autocomplete="off"></div><div class="km-field span-4"><label>新 Client ID</label><input name="client_id" autocomplete="off"></div><div class="km-field span-4"><label>新 Client Secret</label><input name="client_secret" type="password" autocomplete="new-password"></div>
</div></div><div class="km-dialog-foot"><button type="button" data-close>取消</button><button id="update-source" class="primary" type="submit">保存修改</button></div></form></dialog>
<script src="../runtime-config.js"></script><script src="../shared/kbot-api-client.js"></script><script src="../shared/kbot-dev-adapter.js"></script><script src="../shared/kbot-shell.js"></script><script src="./js/km-sources.js"></script></body></html>
