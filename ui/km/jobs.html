<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KM 同步任务</title><link rel="stylesheet" href="./css/km.css"></head>
<body data-page="jobs"><main class="km-main"><header class="km-page-head"><div><h1>同步任务</h1><p>按 Asset 查看每次同步链，以及 KM 和 Knowledge Core 的真实处理步骤。</p></div><div class="km-actions"><button id="refresh-jobs">刷新</button></div></header>
  <section class="km-panel"><div class="km-panel-body"><form id="job-form" class="km-filters"><div class="km-field span-8"><label for="job-source">数据来源</label><select id="job-source"><option value="">全部来源</option></select></div><div class="km-field"><label for="job-limit">最近任务数量</label><select id="job-limit"><option>50</option><option selected>100</option><option>200</option><option>500</option></select></div><div class="km-filter-actions"><button class="primary" type="submit">查询</button></div></form></div><div class="km-panel-head"><div><h2>Asset 任务树</h2><p id="job-status-text">正在加载</p></div></div><div id="job-data-note" class="km-data-note" hidden></div><div id="job-tree" class="km-job-tree" aria-live="polite"></div></section>
  <section class="km-panel km-source-jobs"><div class="km-panel-head"><div><h2>来源级任务</h2><p>不属于单个 Asset 的 MetaDB 扫描与调度任务</p></div></div><div id="source-job-tree" class="km-job-tree"></div></section>
</main><dialog id="job-detail-dialog"><div class="km-dialog-head"><h2>任务详情</h2><button class="km-close" data-close aria-label="关闭">×</button></div><div class="km-dialog-body"><pre id="job-detail-json" class="km-json"></pre></div></dialog>
