<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KM Asset 处理</title><link rel="stylesheet" href="./css/km.css"></head>
<body data-page="assets"><main class="km-main">
  <header class="km-page-head"><div><h1>Asset 处理</h1><p>查看规范化元数据、附件清单、KC 入库状态与失败原因。</p></div></header>
  <section class="km-panel"><div class="km-panel-body"><form id="asset-form" class="km-filters"><div class="km-field span-6"><label for="asset-source">数据来源</label><select id="asset-source"><option value="">全部来源</option></select></div><div class="km-field span-3"><label for="asset-status">入库状态</label><select id="asset-status"><option value="">全部状态</option><option>DISCOVERED</option><option>SYNC_PENDING</option><option>DOWNLOADING</option><option>DOWNLOAD_FAILED</option><option>READY_FOR_INGESTION</option><option>INGESTING</option><option>KC_ACCEPTED</option><option>PARSING</option><option>READY</option><option>RETRY_PENDING</option><option>FAILED</option></select></div><div class="km-field span-3"><label for="asset-limit">每页数量</label><select id="asset-limit"><option>50</option><option selected>100</option><option>200</option><option>500</option></select></div><input id="asset-offset" type="hidden" value="0"><div class="km-filter-actions"><button type="submit" class="primary">查询</button></div></form></div>
  <div class="km-panel-head"><div><h2>Asset 清单</h2><p id="asset-status-text">正在加载</p></div><div class="km-actions"><button id="asset-prev" class="small">上一页</button><button id="asset-next" class="small">下一页</button></div></div><div class="km-table-wrap"><table class="km-table"><thead><tr><th>Asset</th><th>标题 / 作者</th><th>主题</th><th>入库状态</th><th>附件</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="asset-rows"></tbody></table></div></section>
</main><dialog id="asset-detail-dialog"><div class="km-dialog-head"><h2>Asset 详情</h2><button class="km-close" data-close aria-label="关闭">×</button></div><div class="km-dialog-body"><pre id="asset-detail-json" class="km-json"></pre></div></dialog>
<script src="../runtime-config.js"></script><script src="../shared/kbot-api-client.js?v=20260813_5"></script><script src="../shared/kbot-km-auth-v2.js"></script><script src="../shared/kbot-shell.js?v=20260813_5"></script><script src="./js/km-assets.js?v=20260813_6"></script></body></html>
