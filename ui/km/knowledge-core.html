<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KM Knowledge Core</title><link rel="stylesheet" href="./css/km.css"></head>
<body data-page="knowledge-core"><main class="km-main">
  <header class="km-page-head"><div><h1>Knowledge Core</h1><p>创建和管理当前 Domain 唯一的 KM Portal Asset Collection。数据来源和 KM Agent 均使用这里的知识内容。</p></div><div class="km-actions"><button id="refresh-knowledge-core">刷新</button><button id="create-knowledge-core" class="primary" hidden>创建 Knowledge Core</button></div></header>
  <p id="knowledge-core-page-error" class="km-form-error" hidden></p>
  <section class="km-grid">
    <article class="km-panel span-12"><div class="km-panel-head"><div><h2>固定 Collection</h2><p>名称固定为 assets，避免 KM 来源绑定到错误的知识域。</p></div><div id="knowledge-core-status"></div></div><div class="km-panel-body" id="knowledge-core-summary"></div></article>
    <article class="km-panel span-12"><div class="km-panel-head"><div><h2>模型绑定</h2><p>文本和视觉 Embedding 一经设定不能更换；Parser LLM 可按版本更新。</p></div><button id="edit-knowledge-core-models" hidden>配置模型</button></div><div class="km-table-wrap"><table class="km-table"><thead><tr><th>模型角色</th><th>模型</th><th>类别</th><th>变更规则</th></tr></thead><tbody id="knowledge-core-model-rows"></tbody></table></div></article>
  </section>
</main>
<dialog id="knowledge-core-dialog"><form id="knowledge-core-form"><input type="hidden" name="mode"><input type="hidden" name="expected_row_version"><div class="km-dialog-head"><h2 id="knowledge-core-dialog-title">创建 KM Knowledge Core</h2><button type="button" class="km-close" data-close aria-label="关闭">×</button></div><div class="km-dialog-body"><div class="km-form-grid">
  <div class="km-field span-6"><label>Collection 名称</label><input value="assets" disabled></div><div class="km-field span-6" id="knowledge-core-security-field"><label>默认安全级别</label><input name="default_security_level" type="number" min="0" max="999" value="1" required></div>
  <div class="km-field span-12" id="knowledge-core-description-field"><label>描述</label><input name="description" maxlength="1000" value="KM Portal Asset 文档固定 Collection"></div>
  <div class="km-field span-6"><label>Parser LLM</label><select name="parser_llm" data-model-category="1" required></select></div><div class="km-field span-6"><label>文本 Embedding</label><select name="embedding" data-model-category="2" required></select><p class="km-help">创建后不可更换。</p></div>
  <div class="km-field span-6"><label>视觉 Embedding（可选）</label><select name="visual_embedding" data-model-category="3"><option value="">不启用</option></select><p class="km-help">设定后不可更换或移除。</p></div>
</div></div><div class="km-dialog-foot"><button type="button" data-close>取消</button><button id="save-knowledge-core" class="primary" type="submit">创建</button></div></form></dialog>
<script src="../runtime-config.js"></script><script src="../shared/kbot-api-client.js?v=20260813_5"></script><script src="../shared/kbot-km-auth-v2.js?v=20260818_2"></script><script src="../shared/kbot-shell.js?v=20260824_1"></script><script src="./js/km-knowledge-core.js?v=20260824_1"></script></body></html>
