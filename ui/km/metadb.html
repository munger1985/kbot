<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MetaDB 原始数据</title><link rel="stylesheet" href="./css/km.css"></head>
<body data-page="metadb"><main class="km-main">
  <header class="km-page-head"><div><h1>MetaDB 数据</h1><p>只读查看上游 Asset 原始记录，并将失败记录重新标记为待抽取。</p></div></header>
  <section class="km-panel"><div class="km-panel-body"><form id="metadb-form" class="km-filters">
    <div class="km-field span-6"><label for="metadb-source">数据来源</label><select id="metadb-source" required></select></div>
    <div class="km-field span-3"><label for="metadb-processed">处理标记</label><select id="metadb-processed"><option value="N">N · 待处理</option><option value="F">F · 失败</option><option value="Y">Y · 已处理</option></select></div>
    <div class="km-field span-3"><label for="metadb-limit">每页数量</label><select id="metadb-limit"><option>50</option><option selected>100</option><option>200</option><option>500</option></select></div>
    <input id="metadb-offset" type="hidden" value="0"><div class="km-filter-actions"><button type="submit" class="primary">查询</button></div>
  </form></div><div class="km-panel-head"><div><h2>原始记录</h2><p id="metadb-status">请选择来源后查询</p></div><div class="km-actions"><button id="metadb-prev" class="small">上一页</button><button id="metadb-next" class="small">下一页</button></div></div>
  <div class="km-table-wrap"><table class="km-table"><thead><tr><th>Asset</th><th>标题</th><th>作者</th><th>主题 / 产品</th><th>处理状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="metadb-rows"></tbody></table></div></section>
</main>
<dialog id="metadb-detail-dialog"><div class="km-dialog-head"><h2>MetaDB 原始记录</h2><button class="km-close" data-close aria-label="关闭">×</button></div><div class="km-dialog-body"><pre id="metadb-json" class="km-json"></pre></div></dialog>
<script src="../shared/kbot-api-client.js"></script><script src="../shared/kbot-dev-adapter.js"></script><script src="../shared/kbot-shell.js"></script><script src="./js/km-metadb.js"></script></body></html>
