<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KM Agent</title><link rel="stylesheet" href="./css/km.css"></head>
<body data-page="agents"><main class="km-main"><header class="km-page-head"><div><h1>KM Agent</h1><p>每个 Agent 固定绑定一个 KM 来源，同时具备文档检索与 Asset 元数据问数能力。</p></div><div class="km-actions"><button id="refresh-agents">刷新</button><button id="new-agent" class="primary">创建 Agent</button></div></header>
  <p id="agent-page-error" class="km-form-error" hidden></p>
  <section class="km-panel"><div class="km-table-wrap"><table class="km-table"><thead><tr><th>Agent</th><th>来源</th><th>状态</th><th>模型配置</th><th>重排</th><th>版本</th><th>操作</th></tr></thead><tbody id="agent-rows"></tbody></table></div></section>
</main><dialog id="agent-dialog"><form id="agent-form"><input type="hidden" name="agent_id"><input type="hidden" name="expected_row_version"><div class="km-dialog-head"><h2 id="agent-dialog-title">创建 KM Agent</h2><button type="button" class="km-close" data-close aria-label="关闭">×</button></div><div class="km-dialog-body"><div class="km-form-grid">
  <div class="km-field span-6"><label>数据来源</label><select name="source_id" id="agent-source" required></select></div><div class="km-field span-6"><label>显示名称</label><input name="display_name" required maxlength="256"></div><div class="km-field span-12"><label>描述</label><input name="description" maxlength="1000"></div><div class="km-field span-12"><label>系统指令</label><textarea name="instruction" maxlength="32000"></textarea></div>
  <div class="km-field span-6"><label>Context LLM</label><select name="context_llm" data-model-kind="llm" required></select></div><div class="km-field span-6"><label>Composer LLM</label><select name="composer_llm" data-model-kind="llm" required></select></div><div class="km-field span-6"><label>Memory LLM</label><select name="memory_llm" data-model-kind="llm" required></select></div><div class="km-field span-6"><label>Memory Embedding</label><select name="memory_embedding" data-model-kind="embedding" required></select></div><div class="km-field span-6"><label>Router LLM</label><select name="router_llm" data-model-kind="llm" required></select></div><div class="km-field span-6"><label>Data Planner LLM</label><select name="data_planner_llm" data-model-kind="llm"><option value="">跟随 Composer</option></select></div>
  <div class="km-field span-6" id="agent-status-field"><label>初始状态</label><select name="status"><option value="DRAFT">DRAFT</option><option value="ACTIVE">ACTIVE</option></select></div><div class="km-field span-6"><label><input name="do_rerank" type="checkbox"> 启用检索重排</label></div>
</div></div><div class="km-dialog-foot"><button type="button" data-close>取消</button><button id="save-agent" class="primary" type="submit">创建</button></div></form></dialog>
<script src="../runtime-config.js"></script><script src="../shared/kbot-api-client.js?v=20260813_5"></script><script src="../shared/kbot-km-auth-v2.js"></script><script src="../shared/kbot-shell.js?v=20260813_5"></script><script src="./js/km-agents-v3.js"></script></body></html>
