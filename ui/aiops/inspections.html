<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日常巡检</title><link rel="stylesheet" href="./css/aiops.css?v=20261020_3"><link rel="stylesheet" href="./css/workspaces.css?v=20261008_2"></head>
<body data-page="inspections">
  <main class="ops-main">
    <header class="ops-head"><div><h1>日常巡检</h1><p>在同一入口查看巡检报告，并管理形成这些报告的执行计划。</p></div><button id="refresh-workspace" type="button">刷新</button></header>
    <nav class="inspection-tabs" aria-label="日常巡检视图"><a aria-current="page" href="./inspections.html">巡检报告</a><a href="./inspection-plans.html" data-plan-manage hidden>巡检计划</a></nav>
    <section class="inspection-summary" aria-label="巡检概况">
      <article><span>当前批次</span><strong id="inspection-total">—</strong></article>
      <article><span>正在执行</span><strong id="inspection-running">—</strong></article>
      <article><span>需要关注</span><strong id="inspection-attention">—</strong></article>
      <article><span>完整完成</span><strong id="inspection-completed">—</strong></article>
    </section>
    <section class="ops-master-detail"><article class="ops-panel ops-case-list"><div class="ops-panel-head"><div><h2>巡检报告</h2><p>每次计划触发形成一个报告批次。</p></div></div><div id="case-list"></div></article><article class="ops-panel ops-case-detail"><div class="ops-panel-head"><h2 id="case-title">选择一份巡检报告</h2></div><div id="case-detail" class="ops-case-content"><div class="ops-empty">目标覆盖、巡检结论和证据将在这里展示。</div></div></article></section>
  </main>
  <script src="../runtime-config.js"></script><script src="../vendor/marked.umd.js"></script><script src="../vendor/purify.min.js"></script><script src="../shared/kbot-markdown.js?v=20260827_1"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js?v=20261020_3"></script><script src="./js/aiops-workspaces.js?v=20261012_1"></script>
</body>
</html>
