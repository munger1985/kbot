<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>历史诊断案例</title>
  <link rel="stylesheet" href="./css/aiops.css?v=20261020_3">
<link rel="stylesheet" href="./css/ammolite-shared.css?v=20261030_1"><link rel="stylesheet" href="./css/reference-cases.css?v=20261030_1"><link rel="stylesheet" href="./css/alignment.css?v=20261030_1"></head>
<body data-page="cases">
  <main class="ops-main diagnosis-cases-page">
    <header class="ops-head"><div><p class="eyebrow">DIAGNOSIS CASES</p><h1>历史诊断案例</h1><p>按诊断参考、已验证处置、性能优化和失败经验分别治理；未确认原因不冒充成功案例。</p></div></header>
    <section id="case-overview" class="case-overview-grid" aria-label="案例状态概览"></section>
    <section class="table-card">
      <header class="resource-list-header"><div class="resource-list-heading"><h2>案例列表</h2><p>已发布案例可供统一 Agent 检索；草稿和待审核版本不会进入问答。</p></div><div class="resource-list-tools"><label class="search-field"><span>⌕</span><input id="case-search" type="search" placeholder="搜索标题、根因或来源报告"></label><label class="resource-list-filter"><span>状态</span><select id="case-status"><option value="">全部状态</option><option value="DRAFT">待完善</option><option value="REVIEW_REQUIRED">待审核</option><option value="PUBLISHED">已发布</option><option value="PROCESSING">提炼中</option><option value="FAILED">处理失败</option><option value="RETIRED">已退役</option></select></label><span id="case-count" class="resource-list-count">0 项</span><button id="refresh-cases" type="button">刷新</button></div></header>
      <div class="table-scroll"><table ><thead><tr><th>案例</th><th>分类</th><th>适用环境</th><th>来源报告</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="case-rows"><tr><td colspan="7" class="empty-cell">正在读取历史诊断案例…</td></tr></tbody></table></div>
    </section>
  </main>
  <dialog id="case-drawer" class="reference-drawer admin-drawer admin-drawer-sectioned case-detail-drawer" aria-labelledby="case-detail-title"><div class="native-drawer-shell"><header class="admin-drawer-header"><div><p class="eyebrow" id="case-detail-eyebrow">历史诊断案例</p><h2 id="case-detail-title">案例详情</h2><p>历史案例只提供经验参考，处理当前故障仍需实时取证。</p></div><div class="knowledge-detail-head-actions"><span id="case-detail-status"></span><button class="icon-button" type="button" data-close aria-label="关闭案例详情">×</button></div></header><div id="case-detail-body" class="admin-drawer-body case-detail-body"></div><footer id="case-detail-actions" class="admin-drawer-footer"></footer></div></dialog>
  <script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js?v=20261030_1"></script><script src="./js/aiops-cases.js?v=20261030_1"></script>
</body>
</html>
