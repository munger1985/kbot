<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知渠道与投递</title><link rel="stylesheet" href="./css/aiops.css?v=20261020_3"><link rel="stylesheet" href="./css/ammolite-shared.css?v=20261103_2"><link rel="stylesheet" href="./css/alignment.css?v=20261030_1"></head>
<body data-page="notification-delivery"><main class="ops-main"><header class="ops-head"><div><h1>通知渠道与投递</h1><p>独立 Worker 推送；ACCEPTED 只表示飞书接受，不表示已读或业务完成。</p></div><button id="delivery-refresh" class="primary">刷新</button></header><p id="delivery-status" role="status"></p>
<section class="ops-panel" data-capability="channel" hidden><h2>企业自建应用连接</h2><p>Secret 加密保存、不回显。保存配置不会自动试发。</p><form id="delivery-connection" class="ops-form-grid"><input name="id" type="hidden"><label>名称<input name="name" required maxlength="128"></label><label>App ID<input name="app_id" required placeholder="cli_…"></label><label>App Secret（编辑时留空不变）<input name="app_secret" type="password" autocomplete="new-password"></label><label><input name="enabled" type="checkbox">启用连接</label><button class="primary">保存连接</button><button type="reset">新建／取消编辑</button></form><label>明确选择试发目标<select id="delivery-test-binding"><option value="">选择已验证身份</option></select></label><div id="delivery-connections"></div></section>
<section class="ops-panel" data-capability="binding" hidden><h2>身份／受控群绑定</h2><p>open_id 按应用隔离；群仅允许低敏告警。修改身份请先停用再重新登记。</p><form id="delivery-binding" class="ops-form-grid"><label>连接<select name="connection_id" required></select></label><label>类型<select name="target_type"><option value="open_id">个人 open_id</option><option value="chat_id">受控群 chat_id</option></select></label><label>已有本地用户 ID（群留空）<input name="actor_id"></label><label>飞书身份<input name="external_id" required placeholder="ou_… / oc_…"></label><button class="primary">登记候选身份</button></form><div id="delivery-bindings"></div></section>
<section class="ops-panel"><h2>验证我的飞书身份</h2><p>验证码仅由本人确认，限时限次，不要转发。</p><div id="delivery-mine"></div></section>
<section class="ops-panel" data-capability="channel" hidden><h2>外部通知策略</h2><p>策略仅筛选当前合法受众，不增加审批权限，不补发历史事件。</p><form id="delivery-policy" class="ops-form-grid"><label>连接<select name="connection_id" required></select></label><label>事件<select name="event_types" multiple required></select></label><label>身份／受控群<select name="binding_ids" multiple></select></label><label>本地用户 ID（逗号分隔；缺失映射会阻断）<input name="actor_ids"></label><label><input name="enabled" type="checkbox">启用策略</label><button class="primary">保存新策略</button></form><div id="delivery-policies"></div></section>
<section class="ops-panel" data-capability="read" hidden><h2>投递记录</h2><p>按筛选状态分页，每页最多 100 条。UNKNOWN 需核验；重试通知不会重新执行业务任务。</p><div id="delivery-jobs"></div><details><summary>所选投递的尝试历史</summary><pre id="delivery-attempts"></pre></details><h2>渠道操作审计</h2><div id="delivery-audit"></div></section></main>
<script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js?v=20261103_3"></script><script src="./js/aiops-notification-delivery.js"></script></body></html>
