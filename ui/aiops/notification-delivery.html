<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知投递</title><link rel="stylesheet" href="./css/aiops.css?v=20261020_3"><link rel="stylesheet" href="./css/ammolite-shared.css?v=20261110_release1"><link rel="stylesheet" href="./css/alignment.css?v=20261110_release1"><link rel="stylesheet" href="./css/notification-delivery.css?v=20261106_2"></head>
<body data-page="notification-delivery"><main class="ops-main delivery-page"><header class="ops-head"><div><h1>通知投递</h1><p>平台接受不表示用户已读，业务处理仍回原任务完成。</p></div><button id="delivery-refresh" class="secondary-button" type="button">刷新</button></header><p id="delivery-status" role="status"></p><a class="secondary-button" href="./notification-channels.html" data-capability="channel" hidden>通知渠道</a><section data-capability="read" hidden>
<div id="delivery-metrics" class="delivery-metrics"></div><form id="delivery-filters" class="delivery-filters"><label class="control-field">时间范围<select name="range"><option value="24h">最近 24 小时</option><option value="7d" selected>最近 7 天</option><option value="30d">最近 30 天</option><option value="all">全部时间</option></select></label><label class="control-field">投递状态<select name="status"><option value="">全部状态</option></select></label><label class="control-field">消息类型<select name="event_type"><option value="">全部类型</option></select></label><label class="control-field">接收用户 ID<input name="recipient_actor_id" maxlength="256" placeholder="精确查找，可选"></label><div class="toolbar-actions"><button class="primary-button">查询</button><button class="secondary-button" type="reset">重置</button></div></form>
<div class="table-card delivery-table"><div id="delivery-jobs"></div><footer class="delivery-pagination"><label>每页<select id="delivery-page-size"><option value="20">20 条</option><option value="50">50 条</option></select></label><span id="delivery-page-label">第 1 页</span><button id="delivery-prev" class="secondary-button" disabled>上一页</button><button id="delivery-next" class="secondary-button" disabled>下一页</button></footer></div>
<details id="delivery-audit-panel" class="delivery-card"><summary>渠道操作记录 · 最近 20 条</summary><p>与消息尝试历史分开记录。</p><div id="delivery-audit"></div></details></section>
<div class="admin-drawer-backdrop" hidden><aside id="delivery-detail" class="admin-drawer admin-drawer-sectioned" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="delivery-detail-title"><header class="admin-drawer-header"><h2 id="delivery-detail-title">投递详情</h2><button type="button" class="icon-button" aria-label="关闭" data-close="delivery-detail">×</button></header><div class="admin-drawer-body admin-drawer-content"><div id="delivery-detail-summary"></div><h3>尝试历史</h3><div id="delivery-attempts" class="delivery-timeline"></div></div><footer class="admin-drawer-footer"><button class="secondary-button" type="button" data-close="delivery-detail">关闭</button><button id="delivery-retry" class="primary-button" hidden>重试通知</button></footer></aside></div>
</main>
<script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js?v=20261106_2"></script><script src="../shared/kbot-drawer.js?v=20261106_2"></script><script src="./js/aiops-notification-delivery.js?v=20261106_4"></script></body></html>
