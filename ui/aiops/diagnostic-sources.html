<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>诊断源</title>
  <link rel="stylesheet" href="./css/aiops.css">
  <link rel="stylesheet" href="./css/aiops-forms.css">
</head>
<body data-page="diagnostic-sources">
  <main class="ops-main">
    <header class="ops-head">
      <div><h1>诊断源</h1><p>管理 Prometheus、Alertmanager、Loki、OEM 与其他可查询观测数据源。</p></div>
      <button id="create-diagnostic-source" class="primary" type="button" data-write-ready>新增诊断源</button>
    </header>
    <section class="ops-panel"><div class="ops-table-wrap"><table class="ops-table"><thead id="ops-table-head"></thead><tbody id="ops-table-body"></tbody></table></div></section>
  </main>
  <dialog id="diagnostic-source-dialog" class="ops-dialog">
    <form id="diagnostic-source-form">
      <header><h2 id="diagnostic-source-dialog-title">新增诊断源</h2><button data-close-dialog type="button">关闭</button></header>
      <div class="ops-dialog-body">
        <div class="ops-form">
          <div class="ops-field span-6"><label for="source-display-name">名称</label><input id="source-display-name" name="display_name" maxlength="256" placeholder="例如：生产 Prometheus" required></div>
          <div class="ops-field span-6"><label for="source-type">类型</label><select id="source-type" name="source_type" required><option value="PROMETHEUS">Prometheus</option><option value="ALERTMANAGER">Alertmanager</option><option value="LOKI">Loki</option><option value="ZABBIX">Zabbix</option><option value="OEM">Oracle OEM</option></select></div>
          <div class="ops-field span-12"><label for="source-endpoint">访问地址</label><input id="source-endpoint" name="endpoint" type="url" placeholder="http://monitor.internal:9090"><small id="source-endpoint-help">请输入 KBot 服务可以访问的地址。</small></div>
          <div id="source-token-field" class="ops-field span-12"><label for="source-token">API Token（可选）</label><input id="source-token" name="token" type="password" autocomplete="new-password"><small>留空表示该诊断源不需要 Bearer Token；编辑时留空表示保持原凭据。</small></div>
          <div id="source-webhook-field" class="ops-field span-12" hidden><label for="source-webhook-secret">Webhook Secret</label><input id="source-webhook-secret" name="webhook_secret" type="password" autocomplete="new-password"><small>用于校验推送到 KBot 的告警请求；编辑时留空表示保持原凭据。</small></div>
          <div id="source-target-label-field" class="ops-field span-6" hidden><label for="source-target-label">目标标签</label><input id="source-target-label" name="target_label" value="instance" maxlength="256"><small>从 Alertmanager 告警标签中定位监控目标。</small></div>
          <div id="source-tenant-field" class="ops-field span-12" hidden><label for="source-tenant-id">Loki Tenant ID（可选）</label><input id="source-tenant-id" name="tenant_id" maxlength="256"><small>仅多租户 Loki 需要，对应 X-Scope-OrgID。</small></div>
          <div class="ops-field span-12"><span class="ops-field-label">系统声明能力</span><div id="source-capability-list" class="ops-capability-list" aria-live="polite"></div><small>能力由诊断源类型和内置 Adapter 自动确定，无需手工配置。</small></div>
        </div>
        <p class="ops-dialog-note">测试连接始终使用当前表单内容且不会保存；编辑时如需验证认证，请重新输入临时凭据。</p>
        <p id="source-test-result" class="ops-connection-result" role="status"></p>
      </div>
      <footer><button id="test-diagnostic-source" class="secondary-action" type="button">测试连接</button><button data-close-dialog type="button">取消</button><button id="save-diagnostic-source" class="primary" type="submit">创建诊断源</button></footer>
    </form>
  </dialog>
  <script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js"></script><script src="./js/aiops-pages.js"></script><script src="./js/aiops-configurations.js"></script>
</body>
</html>
