<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>监控源</title>
  <link rel="stylesheet" href="./css/aiops.css?v=20261020_3"><link rel="stylesheet" href="./css/aiops-forms.css?v=20261010-6">
  <link rel="stylesheet" href="./css/ammolite-shared.css?v=20261110_release1"><link rel="stylesheet" href="./css/reference-diagnostic-sources.css?v=20261030_1"><link rel="stylesheet" href="./css/alignment.css?v=20261110_release1">
</head>
<body data-page="diagnostic-sources">
  <main class="ops-main aiops-page aiops-config-page">
    <header class="ops-head page-header app-page-head"><div><p class="eyebrow">AIOps 配置</p><h1>监控源</h1><p>管理 Prometheus、Loki、Alertmanager、Zabbix 与 OEM 等按能力接入的数据源。</p></div></header>
    <p id="source-error" class="form-error" role="alert" hidden></p>
    <div class="data-toolbar"><label class="search-field"><span aria-hidden="true">⌕</span><input id="source-search" type="search" placeholder="搜索监控源名称、类型或地址"></label><button id="refresh-sources" class="secondary-button" type="button">刷新目录</button></div>
    <section class="resource-list-surface"><div class="resource-list-body"><div id="source-catalog" class="management-catalog-grid"></div></div></section>
  </main>
  <dialog id="diagnostic-source-dialog" class="reference-drawer admin-drawer aiops-target-detail-drawer" aria-labelledby="diagnostic-source-dialog-title">
    <header class="admin-drawer-header"><div><p class="eyebrow">AIOps 配置</p><h2 id="diagnostic-source-dialog-title">新增监控源</h2><p>按数据源能力填写连接信息；凭据保存后不会再次显示。</p></div><button class="icon-button" type="button" data-close-source aria-label="关闭">×</button></header>
    <div class="admin-drawer-body aiops-target-detail-body">
      <form id="diagnostic-source-form" class="resource-form aiops-target-edit-form">
        <section class="drawer-form-section">
          <label class="control-field"><span class="field-label">名称</span><input name="display_name" required maxlength="256"></label>
          <label class="control-field"><span class="field-label">监控源类型</span><select name="source_type"><option>PROMETHEUS</option><option>LOKI</option><option>ALERTMANAGER</option><option>ZABBIX</option><option>OEM</option></select></label>
          <label class="control-field form-span"><span class="field-label">服务地址</span><input name="endpoint" required type="url"><small id="source-endpoint-help" class="field-help">填写监控源的根地址，例如 https://monitor.example.com。</small></label>
          <label id="source-token-field" class="control-field form-span"><span class="field-label">访问令牌（可选）</span><input name="access_token" type="password" autocomplete="new-password"><small class="field-help">仅用于 KBot 主动访问上方监控源 Endpoint；服务端要求 Bearer Token 时才填写。保存后不会再次显示。</small></label>
          <label id="source-oem-username-field" class="control-field" hidden><span class="field-label">OEM 用户名（可选）</span><input name="source_username" autocomplete="off"></label>
          <label id="source-oem-password-field" class="control-field" hidden><span class="field-label">OEM 密码（可选）</span><input name="source_password" type="password" autocomplete="new-password"><small class="field-help">用户名和密码需同时填写；编辑时同时留空保持原凭据，保存后不会回显。</small></label>
          <label id="source-tenant-field" class="control-field form-span" hidden><span class="field-label">日志租户 ID（可选）</span><input name="loki_tenant_id"><small class="field-help">仅多租户 Loki 需要填写；单租户部署请留空。</small></label>
          <p class="field-help form-span">这里只配置监控服务连接。保存、测试并启用后，到业务系统的数据库资源中选择具体监控数据库。</p>
        </section>
        <footer class="admin-drawer-footer"><button class="secondary-button" type="button" data-close-source>取消</button><button id="save-diagnostic-source" class="primary-button" type="submit">创建监控源</button></footer>
      </form>
    </div>
  </dialog>
  <dialog id="source-webhook-drawer" class="reference-drawer admin-drawer webhook-credential-drawer" aria-labelledby="webhook-credential-title">
    <header class="admin-drawer-header"><div><p id="webhook-source-name" class="eyebrow"></p><h2 id="webhook-credential-title">Webhook 接入凭据</h2><p>在独立流程中同时生成验签 Secret 与路由 Key，并完成部署侧配置。</p></div><button class="icon-button" type="button" data-close-webhook aria-label="关闭 Webhook 接入凭据">×</button></header>
    <div id="source-webhook-content"></div>
  </dialog>

  <script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js?v=20261111_center2"></script><script src="./js/aiops-configurations.js?v=20261105_confirm1"></script>
</body>
</html>
