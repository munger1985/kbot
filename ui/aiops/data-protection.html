<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据保护</title><link rel="stylesheet" href="./css/aiops.css?v=20261020_3"><link rel="stylesheet" href="./css/aiops-forms.css?v=20261014-5"></head><body data-page="data-protection"><main class="ops-main"><header class="ops-head"><div><h1>数据保护</h1><p>按数据库资源管理外部备份校验、恢复目标和人工确认恢复。</p></div><a class="ops-button" href="./recovery-drills.html">恢复演练</a></header><section class="ops-panel"><div class="ops-panel-head"><div><h2>能力边界</h2><p>当前不会自动执行备份，也不会在此直接执行 Restore 或 Recover。</p></div></div><div class="ops-panel-body system-card-grid"><article><h3>外部备份校验</h3><span class="ops-badge good">可配置</span><p>检查已有备份来源、成功时效、保留期和 RPO/RTO。</p></article><article><h3>自动执行数据库备份</h3><span class="ops-badge warn">后续能力</span><p>后续接入受控执行引擎和备份运行记录。</p></article><article><h3>恢复与人工确认</h3><span class="ops-badge good">恢复演练可用</span><p>恢复结果登记和审核在独立恢复演练工作区完成。</p></article></div></section><section class="ops-panel"><div class="ops-panel-head"><div><h2>保护配置</h2><p>保护策略直接归属数据库资源，不会因只填写 RPO/RTO 就显示已覆盖。</p></div><select id="protection-system"><option value="">请选择数据库资源</option></select></div><div class="ops-panel-body"><form id="protection-form" class="ops-form" hidden><div class="ops-field span-6"><label>备份策略校验</label><select name="backup_policy_enabled"><option value="true">启用</option><option value="false">停用</option></select></div><div class="ops-field span-3"><label>备份频率（小时）</label><input name="backup_frequency_hours" type="number" min="1" value="24"></div><div class="ops-field span-3"><label>成功备份最大时效（小时）</label><input name="backup_success_max_age_hours" type="number" min="1" value="26"></div><div class="ops-field span-3"><label>保留天数</label><input name="backup_retention_days" type="number" min="1" value="30"></div><div class="ops-field span-3"><label>RPO（秒）</label><input name="rpo_seconds" type="number" min="0" value="3600"></div><div class="ops-field span-3"><label>RTO（秒）</label><input name="rto_seconds" type="number" min="60" value="14400"></div><div class="ops-field span-3"><label>定期恢复演练</label><select name="drill_required"><option value="true">要求</option><option value="false">不要求</option></select></div><div class="ops-field span-3"><label>演练周期（天）</label><input name="required_drill_interval_days" type="number" min="1" value="180"></div><div class="ops-field span-6"><label>最低保障等级</label><select name="required_assurance_level"><option value="BACKUP_METADATA">备份元数据</option><option value="RESTORE_VALIDATE">恢复校验</option><option value="DATABASE_OPEN">数据库可打开</option><option value="APPLICATION_VALIDATED">业务验证通过</option></select></div><div class="ops-field span-12"><label>必需备份来源</label><select name="required_backup_source_types" multiple size="6"></select></div><div class="ops-field span-12"><label>策略说明</label><textarea name="source_note" rows="3"></textarea></div><div class="ops-actions span-12"><button class="primary" type="submit">保存配置新版本</button><span id="protection-result" class="ops-connection-result"></span></div></form><p id="protection-empty" class="ops-empty">请选择数据库资源。</p></div></section></main><script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js?v=20261020_3"></script><script src="./js/aiops-data-protection.js?v=20261014-5"></script></body></html>
