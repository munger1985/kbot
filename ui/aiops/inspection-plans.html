<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巡检计划</title><link rel="stylesheet" href="./css/aiops.css"><link rel="stylesheet" href="./css/aiops-forms.css"></head>
<body data-page="inspection-plans">
  <main class="ops-main">
    <header class="ops-head"><div><h1>巡检计划</h1><p>配置周期、目标范围、检查模板与报告输出。</p></div><button id="create-inspection-plan" class="primary" type="button" data-write-ready>新增计划</button></header>
    <section class="ops-panel"><div class="ops-table-wrap"><table class="ops-table"><thead id="ops-table-head"></thead><tbody id="ops-table-body"></tbody></table></div></section>
  </main>
  <dialog id="inspection-plan-dialog" class="ops-dialog">
    <form id="inspection-plan-form">
      <header><h2 id="inspection-plan-dialog-title">新增巡检计划</h2><button data-close-dialog type="button">关闭</button></header>
      <div class="ops-dialog-body">
        <div class="ops-form">
          <div class="ops-field span-8"><label for="plan-display-name">计划名称</label><input id="plan-display-name" name="display_name" maxlength="256" required></div>
          <div class="ops-field span-4"><label for="plan-schedule-type">调度类型</label><select id="plan-schedule-type" name="schedule_type"><option>DAILY</option><option>WEEKLY</option><option>CRON</option></select></div>
          <div class="ops-field span-6"><label for="plan-cron">Cron 表达式</label><input id="plan-cron" name="cron_expression" value="0 2 * * *" minlength="9" maxlength="256" required></div>
          <div class="ops-field span-6"><label for="plan-timezone">IANA 时区</label><input id="plan-timezone" name="timezone" value="Asia/Shanghai" maxlength="64" required></div>
          <div class="ops-field span-6"><label for="plan-template-id">巡检模板 ID</label><input id="plan-template-id" name="template_id" maxlength="128" required></div>
          <div class="ops-field span-3"><label for="plan-template-version">模板版本</label><input id="plan-template-version" name="template_version" value="1.0.0" maxlength="64" required></div>
          <div class="ops-field span-3"><label for="plan-resolver-version">解析器版本</label><input id="plan-resolver-version" name="schedule_resolver_version" value="v1" maxlength="64" required></div>
          <div class="ops-field span-4"><label for="plan-timeout">超时秒数</label><input id="plan-timeout" name="timeout_seconds" type="number" min="1" max="86400" value="1800" required></div>
          <div class="ops-field span-4"><label for="plan-overlap">重叠策略</label><select id="plan-overlap" name="overlap_policy"><option>SKIP</option><option>QUEUE</option></select></div>
          <div class="ops-field span-4"><label for="plan-misfire">补跑策略</label><select id="plan-misfire" name="misfire_policy"><option>LATEST_ONLY</option><option>SKIP</option></select></div>
        </div>
        <p class="ops-dialog-note">调度类型创建后不可修改；模板 ID、版本和解析器版本必须与部署登记一致。</p>
        <p id="inspection-plan-result" class="ops-connection-result" role="status"></p>
      </div>
      <footer><button data-close-dialog type="button">取消</button><button id="save-inspection-plan" class="primary" type="submit">创建计划</button></footer>
    </form>
  </dialog>
  <script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js"></script><script src="./js/aiops-pages.js"></script><script src="./js/aiops-configurations.js"></script>
</body>
</html>
