<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>业务系统</title><link rel="stylesheet" href="./css/aiops.css?v=20261020_3"><link rel="stylesheet" href="./css/aiops-forms.css?v=20261019-1"></head>
<body data-page="business-systems"><main class="ops-main"><header class="ops-head"><div><h1>业务系统</h1><p>从业务系统进入，统一查看资源、关系与自动推导的运行架构。</p></div></header><section class="ops-panel"><div class="ops-panel-head"><div><h2>业务系统目录</h2><p>数据库一期可管理；应用服务、中间件、网络和存储已纳入同一资源模型。</p></div><div class="business-system-directory-tools"><span id="system-count">0 个</span><button id="refresh-systems" type="button">刷新</button></div></div><nav id="system-status-filter" class="business-system-status-filter" aria-label="业务系统状态"><button class="active" type="button" data-status="">全部</button><button type="button" data-status="ENABLED">运行中</button><button type="button" data-status="DRAFT">草稿</button><button type="button" data-status="DISABLED">已下线</button></nav><div id="system-list" class="ops-panel-body"><div class="ops-empty">正在加载…</div></div></section></main>
<dialog id="business-system-action-dialog" class="ops-dialog business-system-lifecycle-dialog"><form method="dialog"><header><div><small>业务系统生命周期</small><h2 id="business-system-action-title">确认操作</h2></div></header><div class="ops-dialog-body"><p id="business-system-action-message"></p></div><footer><button value="cancel">取消</button><button id="business-system-action-confirm" class="primary" value="confirm">确认</button></footer></form></dialog>
<dialog id="business-system-offline-dialog" class="ops-dialog business-system-lifecycle-dialog"><form id="business-system-offline-form"><header><div><small>业务系统生命周期</small><h2 id="business-system-offline-title">下线业务系统</h2></div><button type="button" data-close-offline aria-label="关闭">×</button></header><div class="ops-dialog-body"><p>下线后不再作为运行中的业务系统展示；资源、拓扑与历史数据保持不变。</p><label class="ops-field">下线原因<textarea name="reason" rows="4" maxlength="1000" required placeholder="请说明本次下线的业务背景或变更依据"></textarea></label></div><footer><button type="button" data-close-offline>取消</button><button class="danger" type="submit">确认下线</button></footer></form></dialog>
<script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js?v=20261020_3"></script><script src="./js/aiops-business-systems.js?v=20261015-2"></script></body></html>
