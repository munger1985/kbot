<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>运维目标详情</title>
  <link rel="stylesheet" href="./css/aiops.css">
  <link rel="stylesheet" href="./css/aiops-forms.css">
</head>
<body data-page="target-detail">
  <main class="ops-main">
    <header class="ops-head">
      <div><h1>运维目标详情</h1><p>查看目标连接、凭据状态、诊断源绑定与运行概况。</p></div>
      <button onclick="history.back()">返回</button>
    </header>

    <div class="ops-grid target-detail-grid">
      <section id="ops-detail" class="ops-panel span-7"><div class="ops-panel-body">正在加载…</div></section>

      <section id="target-subscription" class="ops-panel span-5 target-subscription-panel" aria-labelledby="target-subscription-title">
        <div class="ops-panel-head">
          <div>
            <h2 id="target-subscription-title">关注与通知</h2>
            <p>只配置当前用户是否接收这个 Target 的站内通知。</p>
          </div>
          <span id="target-subscription-state" class="ops-badge">读取中</span>
        </div>
        <div class="ops-panel-body">
          <form id="target-subscription-form">
            <label class="target-follow-switch">
              <input name="follow_target" type="checkbox">
              <span><strong>关注该目标</strong><small>符合条件的故障和诊断进展将进入通知中心。</small></span>
            </label>

            <div id="target-subscription-settings" class="target-subscription-settings">
              <div class="ops-field">
                <label for="target-subscription-severity">最低严重级别</label>
                <select id="target-subscription-severity" name="minimum_severity">
                  <option value="INFO">INFO · 全部事件</option>
                  <option value="WARNING">WARNING · 警告及以上</option>
                  <option value="HIGH" selected>HIGH · 高风险及以上</option>
                  <option value="CRITICAL">CRITICAL · 仅严重故障</option>
                </select>
              </div>

              <fieldset class="target-stage-fieldset">
                <legend>通知阶段</legend>
                <label><input type="checkbox" name="stages" value="SITUATION_DETECTED" checked><span><strong>发现故障</strong><small>确认异常情境首次建立</small></span></label>
                <label><input type="checkbox" name="stages" value="DIAGNOSIS_STARTED" checked><span><strong>开始诊断</strong><small>自动根因诊断已经启动</small></span></label>
                <label><input type="checkbox" name="stages" value="REPORT_READY" checked><span><strong>报告生成</strong><small>诊断或验证报告可以查看</small></span></label>
                <label><input type="checkbox" name="stages" value="SITUATION_RECOVERED" checked><span><strong>故障恢复</strong><small>相关异常信号已经全部恢复</small></span></label>
              </fieldset>
            </div>

            <p id="target-subscription-result" class="ops-connection-result" role="status"></p>
            <div class="target-subscription-actions"><button id="save-target-subscription" class="primary" type="submit">保存通知设置</button></div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script src="../runtime-config.js"></script>
  <script src="./js/aiops-auth.js"></script>
  <script src="./js/aiops-shell.js"></script>
  <script src="./js/aiops-pages.js"></script>
</body>
</html>
