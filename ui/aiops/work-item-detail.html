<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作项详情</title><link rel="stylesheet" href="./css/aiops.css?v=20261010_4"></head>
<body data-page="work-item-detail"><main class="ops-main ops-work-item-detail-main"><header class="ops-head"><div><a class="ops-back-link" href="./work-items.html">返回工作项中心</a><h1 id="work-item-title">工作项详情</h1><p id="work-item-summary">正在加载事实、处理状态和证据链…</p></div><div class="ops-actions"><span id="work-item-key"></span><button id="work-item-detail-refresh" type="button">刷新</button></div></header>
<section id="work-item-overview" class="ops-work-item-overview"><div class="ops-empty">正在加载工作项…</div></section>
<section class="ops-work-item-detail-grid"><article class="ops-panel"><div class="ops-panel-head"><div><h2>事实与发生记录</h2><p>同一指纹的问题归并展示，不重复制造工单。</p></div></div><div id="work-item-occurrences"><div class="ops-empty">暂无发生记录</div></div></article><aside class="ops-work-item-side"><section class="ops-panel" id="work-item-assignment-panel"><div class="ops-panel-head"><h2>责任分派</h2></div><form id="work-item-assignment" class="ops-panel-body ops-work-item-action-form"><label>责任组<input name="assignment_group" maxlength="128" placeholder="例如 DBA-L2"></label><label>责任人用户 ID<input name="assignee_user_id" maxlength="256" placeholder="留空表示未分派"></label><button class="primary" type="submit">保存分派</button></form></section><section class="ops-panel"><div class="ops-panel-head"><h2>处理推进</h2></div><form id="work-item-transition" class="ops-panel-body ops-work-item-action-form"><label>下一状态<select name="status" required></select></label><label>当前阶段<select name="phase" required><option>TRIAGE</option><option>DIAGNOSIS</option><option>REMEDIATION</option><option>APPROVAL</option><option>EXECUTION</option><option>VERIFICATION</option></select></label><label>等待原因<input name="wait_reason" maxlength="256"></label><label>解决代码<select name="resolution_code"><option value="">不适用</option><option>FIXED</option><option>MITIGATED</option><option>ACCEPTED_RISK</option><option>DUPLICATE</option><option>NO_ACTION</option><option>CANNOT_REPRODUCE</option></select></label><label>处理说明<textarea name="resolution_note" maxlength="4000" placeholder="解决或关闭时必填"></textarea></label><button class="primary" type="submit">更新状态</button></form></section></aside></section>
<section class="ops-work-item-bottom"><article class="ops-panel"><div class="ops-panel-head"><h2>关联资源</h2></div><div id="work-item-links"><div class="ops-empty">暂无关联资源</div></div></article><article class="ops-panel"><div class="ops-panel-head"><h2>活动时间线</h2></div><div id="work-item-activities"><div class="ops-empty">暂无活动记录</div></div></article></section></main>
<script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js"></script><script src="./js/aiops-work-items.js?v=20261010_1"></script></body></html>
