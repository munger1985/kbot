<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能诊断</title><link rel="stylesheet" href="./css/aiops.css"><link rel="stylesheet" href="./css/workspaces.css?v=20260827_1"></head>
<body data-page="chat"><main class="ops-main"><header class="ops-head"><div><h1>智能诊断</h1><p>选择一个 Agent 后直接描述问题；Target、监控源和权限均使用 Agent 的有效绑定。</p></div><button id="new-conversation" class="primary" type="button">新建诊断</button></header>
<section class="ops-workspace"><aside class="ops-workspace-list"><div class="ops-workspace-list-head"><h2>诊断会话</h2><select id="agent-select" aria-label="选择 Agent"><option value="">正在读取 Agent…</option></select></div><div id="conversation-list" class="ops-workspace-items"></div></aside><article class="ops-conversation"><header class="ops-conversation-head"><h2 id="conversation-title">开始一次数据库诊断</h2><p id="conversation-context">选择 Agent，随后在下方描述问题。</p></header><div id="message-list" class="ops-messages"></div><form id="conversation-form" class="ops-composer"><textarea name="message" required maxlength="32000" placeholder="描述现象、影响和时间范围，或在 Agent 请求后粘贴查询结果…"></textarea><div id="upload-preview" class="ops-composer-hint"></div><div class="ops-composer-row"><label class="ops-button">上传结果截图<input id="evidence-file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><span class="ops-composer-hint">截图仅在 Agent 请求补充证据时提交；不要上传密码或连接串。</span><button class="primary" type="submit">发送</button></div></form></article></section></main>
<script src="../runtime-config.js"></script><script src="../vendor/marked.umd.js"></script><script src="../vendor/purify.min.js"></script><script src="../shared/kbot-markdown.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js"></script><script src="./js/aiops-workspaces.js?v=20260827_2"></script></body></html>
