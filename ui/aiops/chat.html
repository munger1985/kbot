<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能诊断</title><link rel="stylesheet" href="./css/aiops.css"></head><body data-page="chat"><main class="ops-main"><header class="ops-head"><div><h1>智能诊断</h1><p>选择 AIOps Agent 与运维目标，描述问题并启动有证据链的诊断运行。</p></div></header><section class="ops-grid"><article class="ops-panel span-8"><div class="ops-panel-head"><h2>诊断对话</h2></div><div class="ops-panel-body"><div id="chat-output" class="ops-code">尚未发起诊断。</div><form id="chat-form" class="ops-form"><div class="ops-field span-6"><label>Agent ID</label><input name="agent_id" required></div><div class="ops-field span-6"><label>目标 ID</label><input name="target_id" required></div><div class="ops-field span-12"><label>问题描述</label><textarea name="input" required placeholder="例如：分析过去一小时数据库响应时间升高的原因"></textarea></div><div class="ops-filter-actions"><button class="primary">开始诊断</button></div></form></div></article><aside class="ops-panel span-4"><div class="ops-panel-head"><h2>诊断边界</h2></div><div class="ops-panel-body">Agent 只读取已绑定的诊断源；需要人工 SQL、审批或补充证据时，Run 会进入明确的等待状态。</div></aside></section></main><script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js"></script><script> KBotAIOpsShell.ready.then(()=>{document.getElementById('chat-form').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.currentTarget));try{const r=await KBotAIOpsAuth.request('/api/v1/apps/aiops/runs',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify(b)});location.href='./run-detail.html?id='+encodeURIComponent(r.ops_run_id)}catch(x){document.getElementById('chat-output').textContent=x.message}}})</script></body></html>
