<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能诊断</title><link rel="stylesheet" href="./css/aiops.css"><link rel="stylesheet" href="./css/workspaces.css?v=20260901_1"></head>
<body data-page="chat"><main class="ops-main"><header class="ops-head"><div><h1>智能诊断</h1><p>先选择要运维的逻辑数据库 Target，再选择能够管理它的 Agent。</p></div><button id="new-conversation" class="primary" type="button">新建诊断</button></header>
<section class="ops-workspace"><aside class="ops-workspace-list"><div class="ops-workspace-list-head"><h2>诊断会话</h2><label for="target-select">逻辑 Target</label><select id="target-select" aria-label="选择逻辑 Target"><option value="">正在读取 Target…</option></select><label for="agent-select">Agent</label><select id="agent-select" aria-label="选择 Agent" disabled><option value="">请先选择 Target</option></select><p id="agent-target-context" class="ops-composer-hint">会话创建后会冻结 Target 和 Agent 版本。</p></div><div id="conversation-list" class="ops-workspace-items"></div></aside><article class="ops-conversation"><header class="ops-conversation-head"><h2 id="conversation-title">开始一次数据库诊断</h2><p id="conversation-context">选择 Target 和 Agent，随后在下方描述问题。</p></header><div id="message-list" class="ops-messages"></div><form id="conversation-form" class="ops-composer"><textarea name="message" maxlength="32000" placeholder="描述现象、影响和时间范围，或直接粘贴日志、SQL输出和命令结果…"></textarea><div id="upload-preview" class="ops-composer-hint"></div><div class="ops-composer-row"><label class="ops-button">上传诊断材料<input id="evidence-file" type="file" accept="image/png,image/jpeg,image/webp,text/plain,text/csv,application/json,application/sql,.log,.sql" hidden></label><span class="ops-composer-hint">支持截图、日志、SQL/命令输出，最大 20 MiB；不要上传密码、密钥或完整连接串。</span><button class="primary" type="submit">发送</button></div></form></article></section></main>
<script src="../runtime-config.js"></script><script src="../vendor/marked.umd.js"></script><script src="../vendor/purify.min.js"></script><script src="../shared/kbot-markdown.js?v=20260827_1"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js"></script><script src="./js/aiops-workspaces.js?v=20260901_2"></script></body></html>
