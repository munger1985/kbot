<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告模板</title><link rel="stylesheet" href="./css/aiops.css"></head>
<body data-page="report-templates">
  <main class="ops-main">
    <header class="ops-head"><div><h1>报告模板</h1><p>系统预设模板只读；自定义模板仅能编排受控章节，且必须保留摘要和证据边界。</p></div><button id="create-report-template" class="primary" type="button">新建自定义模板</button></header>
    <section class="ops-panel"><div class="ops-table-wrap"><table class="ops-table"><thead><tr><th>模板</th><th>来源入口</th><th>报告周期</th><th>版本</th><th>内容哈希</th><th>属性</th></tr></thead><tbody id="ops-report-template-body"><tr><td class="ops-empty" colspan="6">正在加载…</td></tr></tbody></table></div></section>
  </main>
  <dialog id="report-template-dialog" class="ops-dialog"><form id="report-template-form"><header><h2>新建自定义报告模板</h2><p>模板只定义展示章节，不包含查询、脚本、HTML 或外部链接。</p></header><div class="ops-dialog-body"><label class="ops-field">模板名称<input name="display_name" maxlength="256" required></label><fieldset><legend>适用入口</legend><label><input type="checkbox" name="source_kind" value="CHAT" checked> 智能诊断</label><label><input type="checkbox" name="source_kind" value="ALERT" checked> 告警诊断</label><label><input type="checkbox" name="source_kind" value="INSPECTION"> 日常巡检</label></fieldset><fieldset><legend>报告周期</legend><label><input type="checkbox" name="period_kind" value="AD_HOC" checked> 单次诊断</label><label><input type="checkbox" name="period_kind" value="DAILY"> 日常</label><label><input type="checkbox" name="period_kind" value="MONTHLY"> 月度</label><label><input type="checkbox" name="period_kind" value="QUARTERLY"> 季度</label><label><input type="checkbox" name="period_kind" value="ANNUAL"> 年度</label></fieldset><fieldset><legend>展示章节</legend><label><input type="checkbox" name="section" value="EXECUTIVE_SUMMARY" checked disabled> 执行摘要（必选）</label><label><input type="checkbox" name="section" value="SCOPE" checked> 范围</label><label><input type="checkbox" name="section" value="INSPECTION_COVERAGE" checked> 巡检覆盖</label><label><input type="checkbox" name="section" value="RISK_OVERVIEW" checked> 风险概览</label><label><input type="checkbox" name="section" value="FINDINGS" checked> 发现</label><label><input type="checkbox" name="section" value="ROOT_CAUSE"> 根因</label><label><input type="checkbox" name="section" value="RECOMMENDATIONS" checked> 建议</label><label><input type="checkbox" name="section" value="ACTIONS"> 处置与验证</label><label><input type="checkbox" name="section" value="EVIDENCE_BOUNDARY" checked disabled> 证据边界（必选）</label><label><input type="checkbox" name="section" value="EVIDENCE_APPENDIX" checked> 证据附录</label></fieldset><p id="report-template-result" class="ops-connection-result" role="status"></p></div><footer><button type="button" data-close-template>取消</button><button class="primary" type="submit">创建模板</button></footer></form></dialog>
  <script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js"></script><script src="./js/aiops-report-templates.js"></script>
</body></html>
