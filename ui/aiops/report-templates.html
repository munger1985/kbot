<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模板中心</title><link rel="stylesheet" href="./css/aiops.css?v=20261020_3"><link rel="stylesheet" href="./css/aiops-forms.css"><link rel="stylesheet" href="./css/ammolite-shared.css?v=20261103_1"><link rel="stylesheet" href="./css/reference-report-templates.css?v=20261103_2"><link rel="stylesheet" href="./css/alignment.css?v=20261030_1"><link rel="stylesheet" href="./css/daily-inspection-report.css?v=20261103_1"><link rel="stylesheet" href="./css/daily-template-editor.css?v=20261103_5"></head>
<body data-page="report-templates">
  <main class="ops-main aiops-template-page">
    <header class="ops-head"><div><p class="eyebrow">AIOps 模板中心</p><h1>模板中心</h1><p>统一管理巡检检查内容与共享日报版式；会话报告单独配置。</p></div></header>
    <div class="data-toolbar"><label class="search-field"><span aria-hidden="true">⌕</span><input id="template-search" type="search" placeholder="搜索模板名称或报告章节"></label><button id="refresh-templates" class="secondary-button" type="button">刷新目录</button><nav class="segmented-control aiops-template-switch" role="tablist" aria-label="模板类型"><button class="active" data-template-tab="inspection" type="button" role="tab" aria-selected="true">巡检内容模板</button><button data-template-tab="session" type="button" role="tab" aria-selected="false">会话报告模板</button></nav></div>
    <section id="inspection-template-catalog" class="resource-list-surface">
      <p class="notice">标准基础检查将按数据库类型自动纳入；模板勾选用于追加专项，取消勾选不会移除基础检查。</p>
      <div class="resource-list-body"><div class="management-catalog-grid"><button id="create-inspection-template" class="management-catalog-add-card" type="button"><span class="management-catalog-add-mark" aria-hidden="true">+</span><strong>新建巡检模板</strong><small>为巡检计划组合检查项与取证步骤</small></button><div id="ops-inspection-template-body" class="catalog-entries"></div></div></div>
    </section>
    <section id="session-template-catalog" class="resource-list-surface" hidden>
      <div class="resource-list-body"><div class="management-catalog-grid"><button id="create-session-report-template" class="management-catalog-add-card" type="button"><span class="management-catalog-add-mark" aria-hidden="true">+</span><strong>新建会话报告模板</strong><small>定义正式报告的章节与展示顺序</small></button><div id="ops-session-report-template-body" class="catalog-entries"></div></div></div>
    </section>
  </main>

  <section id="daily-template-editor" class="ops-main daily-template-editor" hidden aria-label="巡检模板编辑"></section>

  <dialog id="session-report-template-dialog" class="reference-drawer admin-drawer aiops-template-editor" aria-label="新建模板">
    <header class="admin-drawer-header"><div><p class="eyebrow">会话报告</p><h2>新建模板</h2></div><button class="icon-button" type="button" data-close-session-report-template aria-label="关闭">×</button></header>
    <form id="session-report-template-form" class="admin-drawer-body">
      <section class="drawer-form-section"><label class="control-field"><span class="field-label">模板名称</span><input name="display_name" maxlength="256" required></label><div class="aiops-section-editor"><fieldset id="session-template-sections" class="aiops-template-check-group"><legend>报告章节</legend></fieldset><aside class="aiops-template-preview"><p class="eyebrow">REPORT OUTLINE</p><h3>报告目录预览</h3><ol id="session-template-outline"></ol></aside></div><p id="session-report-template-result" class="notice notice-error" role="status" hidden></p></section>
      <footer class="admin-drawer-footer"><span>保存后形成不可变新版本；历史报告不受影响。</span><button class="secondary-button" type="button" data-close-session-report-template>取消</button><button class="primary-button" type="submit" disabled>保存</button></footer>
    </form>
  </dialog>

  <dialog id="template-history-drawer" class="reference-drawer admin-drawer" aria-label="模板版本历史"><header class="admin-drawer-header"><div><p class="eyebrow">VERSION HISTORY</p><h2 id="template-history-title"></h2><p>每个版本均保持不可变，已生成报告继续引用当时的冻结定义。</p></div><button id="close-template-history" class="icon-button" type="button" aria-label="关闭版本历史">×</button></header><div id="template-history-list" class="admin-drawer-body aiops-version-list"></div></dialog>
  <dialog id="inspection-template-preview-drawer" class="business-app-aiops reference-drawer admin-drawer admin-drawer-wide admin-drawer-sectioned inspection-template-preview-drawer" aria-labelledby="inspection-preview-title">
    <header class="admin-drawer-header"><div><p class="eyebrow">模拟报告预览</p><h2 id="inspection-preview-title"></h2></div><button class="icon-button" type="button" data-close-inspection-preview aria-label="关闭模拟报告预览">×</button></header>
    <div class="admin-drawer-body" aria-busy="false"><p class="notice">模拟样例 · 使用所选发布版本的冻结定义，不访问目标数据库，不执行真实巡检，不代表实际巡检结果。</p><section id="inspection-preview-report"></section></div>
  </dialog>
  <script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js?v=20261102_1"></script><script src="./js/daily-inspection-report.js?v=20261103_1"></script><script type="module" src="./js/aiops-report-templates.js?v=20261103_8"></script>
</body></html>
