<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模板管理</title><link rel="stylesheet" href="./css/aiops.css"><link rel="stylesheet" href="./css/aiops-forms.css"></head>
<body data-page="report-templates">
  <main class="ops-main">
    <header class="ops-head"><div><h1>模板管理</h1><p>巡检模板决定执行哪些检查；会话报告模板只决定 Session 正式报告的展示章节。</p></div></header>

    <section class="ops-panel">
      <div class="ops-panel-head"><div><h2>巡检模板</h2><p>从受控 Check Catalog 勾选检查内容，发布后形成不可变版本。</p></div><button id="create-inspection-template" class="primary" type="button">新建巡检模板</button></div>
      <div class="ops-table-wrap"><table class="ops-table"><thead><tr><th>模板</th><th>版本</th><th>检查项</th><th>内容哈希</th><th>状态</th><th>操作</th></tr></thead><tbody id="ops-inspection-template-body"><tr><td class="ops-empty" colspan="6">正在加载…</td></tr></tbody></table></div>
    </section>

    <section class="ops-panel">
      <div class="ops-panel-head"><div><h2>会话报告模板</h2><p>用于完整 Session 生成正式报告，仅定义章节选择和展示顺序；系统预设模板只读。</p></div><button id="create-session-report-template" class="primary" type="button">新建会话报告模板</button></div>
      <div class="ops-table-wrap"><table class="ops-table"><thead><tr><th>模板</th><th>章节</th><th>版本</th><th>内容哈希</th><th>属性</th><th>操作</th></tr></thead><tbody id="ops-session-report-template-body"><tr><td class="ops-empty" colspan="6">正在加载…</td></tr></tbody></table></div>
    </section>
  </main>

  <dialog id="inspection-template-dialog" class="ops-dialog"><form id="inspection-template-form"><header><h2>新建巡检模板</h2><p>模板只引用受控检查目录，不能提交 SQL、脚本或自由查询。</p></header><div class="ops-dialog-body"><label class="ops-field">模板名称<input name="display_name" maxlength="256" required></label><div id="inspection-template-checks" class="inspection-check-groups"></div><p id="inspection-template-result" class="ops-connection-result" role="status"></p></div><footer><button type="button" data-close-inspection-template>取消</button><button class="primary" type="submit">创建模板</button></footer></form></dialog>

  <dialog id="session-report-template-dialog" class="ops-dialog"><form id="session-report-template-form"><header><h2>新建会话报告模板</h2><p>勾选并按页面顺序生成章节；执行摘要和证据边界（必选）由系统固定保留。</p></header><div class="ops-dialog-body"><label class="ops-field">模板名称<input name="display_name" maxlength="256" required></label><fieldset><legend>展示章节</legend><label><input type="checkbox" name="section" value="EXECUTIVE_SUMMARY" checked disabled> 执行摘要（必选）</label><label><input type="checkbox" name="section" value="SCOPE" checked> 会话范围</label><label><input type="checkbox" name="section" value="RISK_OVERVIEW" checked> 风险概览</label><label><input type="checkbox" name="section" value="FINDINGS" checked> 核验发现</label><label><input type="checkbox" name="section" value="ROOT_CAUSE" checked> 根因分析</label><label><input type="checkbox" name="section" value="RECOMMENDATIONS" checked> 处置建议</label><label><input type="checkbox" name="section" value="ACTIONS"> 处置与验证</label><label><input type="checkbox" name="section" value="EVIDENCE_APPENDIX"> 证据附录</label><label><input type="checkbox" name="section" value="EVIDENCE_BOUNDARY" checked disabled> 证据边界（必选）</label></fieldset><p id="session-report-template-result" class="ops-connection-result" role="status"></p></div><footer><button type="button" data-close-session-report-template>取消</button><button class="primary" type="submit">创建模板</button></footer></form></dialog>

  <script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js"></script><script src="./js/aiops-report-templates.js"></script>
</body></html>
