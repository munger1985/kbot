<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBot AIOps 登录</title><link rel="stylesheet" href="./css/aiops.css?v=20261020_3"></head><body class="ops-login"><main class="ops-login-card"><div class="ops-brand-mark">AI</div><h1>Operations Desk</h1><p>登录 KBot AIOps，进入固定的 aiops_portal 数据库运维工作域。</p><form id="login-form"><div class="ops-field span-12"><label>用户 ID</label><input name="user_id" value="aiopsadmin" required autocomplete="username"></div><div class="ops-field span-12"><label>密码</label><input name="password" type="password" required autocomplete="current-password"></div><div id="login-error" class="ops-error" hidden></div><button class="primary" type="submit">登录 AIOps</button></form></main><script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script>function returnAfterLogin(){const id=sessionStorage.getItem('kbot.aiops.notification_entry.v1')||'';if(/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id))location.replace('./notification-open.html?entry='+encodeURIComponent(id));else location.replace('./dashboard.html')}const f=document.getElementById('login-form');if(KBotAIOpsAuth.load()?.access_token)returnAfterLogin();f.onsubmit=async e=>{e.preventDefault();try{await KBotAIOpsAuth.login(Object.fromEntries(new FormData(f)));returnAfterLogin()}catch(x){const n=document.getElementById('login-error');n.hidden=false;n.textContent=x.message}}</script></body></html>
