<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告中心</title><link rel="stylesheet" href="./css/aiops.css?v=20261020_3"><link rel="stylesheet" href="./css/ammolite-shared.css?v=20261103_2"><link rel="stylesheet" href="./css/reference-reports.css?v=20261103_1"><link rel="stylesheet" href="./css/alignment.css?v=20261030_1"></head>
<body data-page="reports"><main class="ops-main platform-home-page aiops-page">
  <header class="platform-home-header"><div class="login-brand"><span class="brand-mark">A</span><strong>报告中心</strong></div></header>
  <section class="platform-home-hero app-page-head"><div><p class="eyebrow">FORMAL REPORTS</p><h1>报告中心</h1><p>集中查阅智能诊断、告警诊断和日常巡检形成的正式报告；报告版本永不覆盖历史。</p></div></section>
  <section id="report-output-jobs"></section>
  <section id="reports-loading" class="loading-card"><span class="loading-orb"></span>正在读取运维报告…</section>
  <section id="reports-table" class="table-card" hidden><header class="resource-list-header"><div class="resource-list-heading"><h2>正式报告</h2><p>报告保留来源证据、模板版本和历次人工修订。</p></div><div class="resource-list-tools"><label class="resource-list-filter"><span>分类</span><select id="report-category-filter"><option value="">全部</option><option value="INSPECTION">巡检报告</option><option value="DIAGNOSIS">诊断报告</option><option value="SPECIAL_ANALYSIS">专项分析报告</option></select></label><label class="resource-list-filter"><span>模板</span><select id="report-template-filter"><option value="">全部模板</option></select></label><span id="report-count" class="resource-list-count">本页 0 份</span><button id="refresh-reports" class="secondary-button" type="button">刷新</button><button id="import-pgbadger" class="secondary-button" type="button" disabled>导入 pgBadger</button><button id="create-report" class="primary-button" type="button" disabled>生成数据库报告</button></div></header><div class="table-scroll"><table><thead><tr><th>报告</th><th>类型</th><th>模板</th><th>状态</th><th>报告生成时间</th><th>诊断摘要</th><th class="table-action-heading">操作</th></tr></thead><tbody id="reports-body"></tbody></table></div><footer class="table-pagination" aria-label="正式报告分页"><span id="report-page">第 1 页 · 每页最多 50 份</span><div class="table-pagination-controls"><button id="report-previous" class="secondary-button" type="button" disabled>上一页</button><button id="report-next" class="secondary-button" type="button" disabled>下一页</button></div></footer></section>
  <dialog id="report-generate-drawer" class="reference-drawer admin-drawer" aria-label="生成数据库运维报告"><header class="admin-drawer-header"><div><p class="eyebrow">AIOPS GENERATED</p><h2>生成数据库运维报告</h2><p>基于已冻结的快照或活动样本确定性生成，不会在目标库创建对象。</p></div><button class="icon-button" type="button" aria-label="关闭报告表单" data-close-report>×</button></header><form id="report-generate-form" class="admin-drawer-body resource-form"></form></dialog>
  <dialog id="report-import-drawer" class="reference-drawer admin-drawer" aria-label="导入 PostgreSQL pgBadger 报告"><header class="admin-drawer-header"><div><p class="eyebrow">EXTERNAL IMPORTED</p><h2>导入 pgBadger 报告</h2><p>仅接受静态 JSON、HTML 或 gzip；外部结论不会提升为来源已验证事实。</p></div><button class="icon-button" type="button" aria-label="关闭 pgBadger 导入表单" data-close-report>×</button></header><form id="report-import-form" class="admin-drawer-body resource-form"></form></dialog>
</main><script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js?v=20261105_confirm1"></script><script src="./js/aiops-output-jobs.js?v=20261103_1"></script><script src="./js/aiops-records.js?v=20261103_2"></script></body></html>
