<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理</title><link rel="stylesheet" href="./css/aiops.css?v=20261020_3"><link rel="stylesheet" href="./css/ammolite-shared.css?v=20261110_release1"><link rel="stylesheet" href="./css/alignment.css?v=20261110_release1"></head>
<body data-page="users"><main class="ops-main"><header class="ops-head"><div><h1>用户管理</h1><p>管理 AIOps 自建账号；个人飞书身份全局共用，不按业务空间重复绑定。</p></div><button id="user-new" type="button">新建用户</button></header><p id="user-status" role="status"></p>
<section class="ops-panel"><header class="ops-panel-head"><h2 id="user-form-title">新建用户</h2></header><form id="user-form" class="ops-form ops-panel-body">
<div class="ops-field span-6 control-field"><label class="field-label" for="user-id">用户 ID</label><input id="user-id" name="user_id" required maxlength="256"></div><div class="ops-field span-6 control-field"><label class="field-label" for="user-display-name">显示名称</label><input id="user-display-name" name="display_name" maxlength="256"></div>
<div class="ops-field span-6 control-field"><label class="field-label" for="user-password">初始密码</label><input id="user-password" name="password" type="password" minlength="12" required autocomplete="new-password" aria-describedby="user-password-hint"><small id="user-password-hint" class="field-help">至少12位，包含大小写字母、数字及特殊字符；首次登录需修改。</small></div>
<div class="ops-field span-6 control-field"><label class="field-label" for="user-role">初始角色</label><select id="user-role" name="role_code" required></select></div>
<div class="ops-field span-12 control-field"><label class="field-label" for="user-feishu-open-id">飞书 open_id（可选）</label><input id="user-feishu-open-id" name="feishu_open_id" pattern="ou_.+" maxlength="256" placeholder="ou_…" aria-describedby="user-feishu-hint user-feishu-guide"><small id="user-feishu-hint" class="field-help">留空不接收个人飞书通知，站内通知正常；填写后需本人验证。编辑时清空表示解绑。</small><small id="user-feishu-guide" class="field-help">在飞书 <a href="https://open.feishu.cn/api-explorer" target="_blank" rel="noopener noreferrer">API 调试台</a> 选择当前通知渠道的应用，在“发送消息”中将接收者 ID 类型设为 open_id，点击“快速复制 open_id”并选择该成员；无需发送消息。同一个人在不同应用中的 open_id 不同。<a href="https://open.feishu.cn/document/uAjLw4CM/ugTN1YjL4UTN24CO1UjN/trouble-shooting/how-to-obtain-openid" target="_blank" rel="noopener noreferrer">官方说明</a></small></div>
<footer class="ops-filter-actions"><span id="user-binding-status" class="status-pill status-muted" role="status">未绑定</span><button class="primary-button" type="submit">保存用户</button></footer></form></section><section class="ops-panel"><h2>已有用户</h2><div id="user-list"></div></section></main>
<script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js?v=20261106_2"></script><script src="./js/aiops-users.js?v=20261106_1"></script></body></html>
