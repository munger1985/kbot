<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBA 工作项中心</title><link rel="stylesheet" href="./css/aiops.css?v=20261010_4"></head>
<body data-page="work-items"><main class="ops-main ops-work-items-main"><header class="ops-head"><div><h1>DBA 工作项中心</h1><p>集中跟进告警与巡检识别出的待处理事项；报告保留结论，工作项承载责任人、SLA、处理状态和验证闭环。</p></div><button id="work-items-refresh" type="button">刷新</button></header>
<section id="work-item-queues" class="ops-work-item-queues" aria-label="工作队列"><div class="ops-empty">正在加载队列…</div></section>
<form id="work-item-filters" class="ops-work-item-filters"><label>状态<select name="status"><option value="">全部非限定状态</option><option>PENDING_TRIAGE</option><option>OPEN</option><option>IN_PROGRESS</option><option>WAITING</option><option>PENDING_VERIFICATION</option><option>RESOLVED</option><option>CLOSED</option><option>CANCELLED</option></select></label><label>优先级<select name="priority"><option value="">全部优先级</option><option>P1</option><option>P2</option><option>P3</option><option>P4</option></select></label><label>责任范围<select name="ownership"><option value="">全部事项</option><option value="mine">分派给我</option><option value="unassigned">未分派</option></select></label><div><button class="primary" type="submit">筛选</button><button type="reset">清除</button></div></form>
<section class="ops-panel"><div class="ops-panel-head"><div><h2>处理队列</h2><p id="work-item-count">按最近变化排序</p></div></div><div class="ops-table-wrap"><table class="ops-table ops-work-item-table"><thead><tr><th>优先级</th><th>工作项</th><th>数据库实例</th><th>状态 / 阶段</th><th>责任人</th><th>最后发现</th><th>解决 SLA</th><th>发生次数</th><th>操作</th></tr></thead><tbody id="work-item-body"><tr><td colspan="9" class="ops-empty">正在加载工作项…</td></tr></tbody></table></div><div class="ops-work-item-more"><button id="work-item-more" type="button" hidden>加载更多</button></div></section></main>
<script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js"></script><script src="./js/aiops-work-items.js?v=20261010_1"></script></body></html>
