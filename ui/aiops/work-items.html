<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBA 工作项中心</title><link rel="stylesheet" href="./css/aiops.css?v=20261011_3"><link rel="stylesheet" href="./css/aiops-forms.css?v=20261011_3"></head>
<body data-page="work-items"><main class="ops-main ops-work-items-main"><header class="ops-head"><div><h1>DBA 工作项中心</h1><p>集中跟进告警与巡检识别出的待处理事项；报告保留结论，工作项承载责任人、SLA、处理状态和验证闭环。</p></div><button id="work-items-refresh" type="button">刷新</button></header>
<section id="work-item-queues" class="ops-work-item-queues" aria-label="工作队列"><div class="ops-empty">正在加载队列…</div></section>
<form id="work-item-filters" class="ops-work-item-filters"><label>状态<select name="status"><option value="">全部活动事项</option><option value="PENDING_TRIAGE">待研判</option><option value="OPEN">待处理</option><option value="IN_PROGRESS">处理中</option><option value="WAITING">等待中</option><option value="PENDING_VERIFICATION">处理完成</option><option value="RESOLVED">已解决</option><option value="CLOSED">已关闭</option><option value="CANCELLED">已取消</option></select></label><label>优先级<select name="priority"><option value="">全部优先级</option><option>P1</option><option>P2</option><option>P3</option><option>P4</option></select></label><label>责任范围<select name="ownership"><option value="">范围内全部</option><option value="mine">分派给我</option><option value="unassigned">未分派</option></select></label><label hidden>查看范围<select name="visibility"><option value="SCOPE">我的责任范围</option><option value="ALL">全部工作项</option><option value="EXCEPTIONS">异常归属</option></select></label><div><button class="primary" type="submit">筛选</button><button type="reset">清除</button></div></form>
<section class="ops-panel"><div class="ops-panel-head"><div><h2>处理队列</h2><p id="work-item-count">按最近变化排序</p></div></div><div class="ops-table-wrap"><table class="ops-table ops-work-item-table"><thead><tr><th>优先级</th><th>工作项</th><th>来源 Agent / 数据库实例</th><th>状态 / 阶段</th><th>责任人</th><th>最后发现</th><th>解决 SLA</th><th>发生次数</th><th>操作</th></tr></thead><tbody id="work-item-body"><tr><td colspan="9" class="ops-empty">正在加载工作项…</td></tr></tbody></table></div><div class="ops-work-item-more"><button id="work-item-more" type="button" hidden>加载更多</button></div></section></main>
<dialog id="work-item-processing-dialog" class="ops-dialog ops-work-item-dialog"><form id="work-item-processing-form"><header><div><small>当前由你处理</small><h2>处理工作项</h2><p id="work-item-processing-title"></p></div><button type="button" aria-label="关闭处理窗口" data-close-work-item-dialog>关闭</button></header><div class="ops-dialog-body"><section class="ops-work-item-dialog-summary"><article><span>数据库实例</span><strong id="work-item-processing-target">—</strong></article><article><span>当前状态</span><strong id="work-item-processing-status">—</strong></article><article><span>开始处理时间</span><strong id="work-item-processing-started">—</strong></article></section><div class="ops-field"><label class="ops-field-label" for="work-item-resolution-code">处理结论</label><select id="work-item-resolution-code" name="resolution_code"><option value="FIXED">已修复</option><option value="MITIGATED">已缓解</option><option value="OBSERVED_STABLE">观察稳定</option><option value="ACCEPTED_RISK">风险已接受</option><option value="FALSE_POSITIVE">误报</option><option value="DUPLICATE">重复事项</option></select></div><div class="ops-field"><label class="ops-field-label" for="work-item-completion-note">处理结果</label><textarea id="work-item-completion-note" name="completion_note" maxlength="4000" required placeholder="记录采取的措施、结果与后续观察建议"></textarea></div><p class="ops-dialog-note">领取时间由系统自动记录；提交时自动记录完成人和完成时间，并进入待验证状态。</p></div><footer><button type="button" data-close-work-item-dialog>暂不完成</button><button class="primary" type="submit">标记工作完成</button></footer></form></dialog>
<dialog id="work-item-assignment-dialog" class="ops-dialog ops-work-item-dialog ops-work-item-assignment-dialog"><form id="work-item-assignment-form"><header><div><small>Manager 分派</small><h2>分派工作项</h2><p id="work-item-assignment-title"></p></div><button type="button" aria-label="关闭分派窗口" data-close-work-item-dialog>关闭</button></header><div class="ops-dialog-body"><div class="ops-field"><label class="ops-field-label" for="work-item-assignment-group">责任组</label><input id="work-item-assignment-group" disabled></div><div class="ops-field"><label class="ops-field-label" for="work-item-assignment-user">指派给</label><select id="work-item-assignment-user" required><option value="" disabled>请选择组内其他成员</option></select></div><p class="ops-dialog-note">这里只分派责任，不开始处理；被分派人点击“处理”后，工作项才进入处理中。</p></div><footer><button type="button" data-close-work-item-dialog>取消</button><button class="primary" type="submit">确认分派</button></footer></form></dialog>
<script src="../runtime-config.js"></script><script src="./js/aiops-auth.js"></script><script src="./js/aiops-shell.js"></script><script src="./js/aiops-work-items.js?v=20261011_3"></script></body></html>
