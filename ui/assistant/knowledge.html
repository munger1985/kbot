<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>智能工作台 · 知识问答</title>
  <link rel="stylesheet" href="./css/assistant.css">
</head>
<body data-page="knowledge">
<main class="assistant-main">
  <header class="assistant-page-head">
    <div>
      <h1>知识问答</h1>
      <p>由已启用 Agent 在绑定的 Knowledge Core、问数模型和普通对话能力之间自动选择执行路径。</p>
    </div>
    <div class="assistant-actions">
      <select id="knowledge-agent" aria-label="当前 Agent" disabled>
        <option value="">正在读取已启用 Agent</option>
      </select>
      <button class="primary" id="knowledge-new-conversation" type="button" disabled>新建会话</button>
    </div>
  </header>

  <section class="assistant-chat-layout">
    <aside class="assistant-panel assistant-conversation-panel">
      <div class="assistant-panel-head">
        <div><h2>最近会话</h2><p>当前 Agent 范围</p></div>
        <button class="small" type="button" id="knowledge-refresh">刷新</button>
      </div>
      <ul class="assistant-conversation-list" id="knowledge-conversation-list">
        <li class="assistant-chat-empty">等待读取会话</li>
      </ul>
      <div class="assistant-agent-context" id="knowledge-agent-summary">
        <strong>正在读取 Agent</strong>
        <p>仅显示当前 Domain 已启用的 Agent。</p>
      </div>
      <dl class="assistant-chat-context">
        <div><dt>当前 Agent</dt><dd id="knowledge-context-agent">尚未选择</dd></div>
        <div><dt>Knowledge Core</dt><dd id="knowledge-context-core">尚未选择</dd></div>
        <div><dt>问数模型</dt><dd id="knowledge-context-models">尚未选择</dd></div>
      </dl>
    </aside>

    <article class="assistant-panel assistant-chat-panel">
      <div class="assistant-panel-head">
        <div>
          <h2 id="knowledge-title">请选择或创建会话</h2>
          <p id="knowledge-conversation-meta">会话由 Agent Runtime 持久化</p>
        </div>
      </div>
      <div class="assistant-chat-stream" id="knowledge-chat-stream">
        <div class="assistant-chat-empty">选择 Agent 后可创建会话，也可以先在输入框中准备问题。</div>
      </div>
      <div class="assistant-chat-progress" id="knowledge-progress" hidden>等待处理</div>
      <form class="assistant-composer assistant-chat-composer" id="knowledge-form">
        <textarea id="knowledge-input" required maxlength="32000" placeholder="询问客户沟通文档、CRM 数据，或发起普通对话…" disabled></textarea>
        <footer>
          <span id="knowledge-input-hint">请选择已启用 Agent。</span>
          <button class="primary" type="submit" disabled id="knowledge-send">发送</button>
        </footer>
      </form>
    </article>
  </section>
</main>

<dialog class="assistant-dialog assistant-reference-dialog" id="knowledge-reference-dialog">
  <div class="assistant-dialog-head">
    <div>
      <h2 id="knowledge-reference-title">文档引用</h2>
      <p class="dialog-subtitle" id="knowledge-reference-meta"></p>
    </div>
    <button class="assistant-close" type="button" data-close-reference aria-label="关闭">×</button>
  </div>
  <div class="assistant-dialog-body" id="knowledge-reference-body"></div>
</dialog>

<script src="../runtime-config.js"></script>
<script src="./js/assistant-auth.js"></script>
<script src="./js/assistant-api.js"></script>
<script src="./js/assistant-shell.js"></script>
<script src="../vendor/marked.umd.js?v=18.0.9"></script>
<script src="../vendor/purify.min.js?v=3.4.13"></script>
<script src="../shared/kbot-markdown.js?v=20260827_1"></script>
<script src="./js/assistant-knowledge.js"></script>
</body>
</html>
