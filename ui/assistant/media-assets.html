<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能工作台 · 图片资产</title><link rel="stylesheet" href="./css/assistant.css"></head>
<body data-page="media-assets"><main class="assistant-main"><header class="assistant-page-head"><div><h1>图片资产</h1><p>文生图产物以受 Domain 与资产权限控制的对象存储资产保存；数据库仅保留溯源与访问元数据。</p></div></header>
  <section class="assistant-grid"><article class="assistant-panel span-12"><div class="assistant-panel-head"><div><h2>我的可访问图片</h2><p>下载、预览与共享均需再次通过 Domain 和资产授权检查。</p></div><div class="assistant-run-types"><span><i class="image"></i> 文生图资产</span><span><i class="knowledge"></i> 无自动知识入库</span></div></div><div class="assistant-filter-bar"><div class="assistant-field"><label for="asset-keyword">名称或 Run ID</label><input id="asset-keyword" placeholder="输入后由后端过滤"></div><div class="assistant-field compact"><label for="asset-status">状态</label><select id="asset-status"><option>全部状态</option><option>READY</option><option>REJECTED</option><option>FAILED</option></select></div><div class="assistant-field compact"><label for="asset-period">创建时间</label><select id="asset-period"><option>全部时间</option><option>今天</option><option>最近七天</option><option>最近三十天</option></select></div><button type="button" id="asset-filter">筛选</button></div><div class="assistant-table-wrap"><table class="assistant-table"><thead><tr><th>资产</th><th>状态</th><th>尺寸 / 类型</th><th>模型</th><th>提示词版本</th><th>创建时间</th><th>操作</th></tr></thead><tbody><tr><td colspan="7"><div class="assistant-empty"><div><strong>尚无可访问图片资产</strong><p>文生图模型通过验收并完成任务后，才会展示真实预览、尺寸、模型快照、提示词版本和受控下载操作。</p></div></div></td></tr></tbody></table></div></article></section>
</main><script src="../runtime-config.js"></script><script src="./js/assistant-shell.js"></script><script src="./js/assistant-api.js"></script><script src="./js/assistant-management.js"></script></body></html>
