<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能工作台 · 用量与运行记录</title><link rel="stylesheet" href="./css/assistant.css"></head>
<body data-page="usage-runs"><main class="assistant-main"><header class="assistant-page-head"><div><h1>用量与运行记录</h1><p>会话、X Search 与图片生成分别记录 Run、状态、模型快照与安全用量摘要；SSE 不是状态事实来源。</p></div><div class="assistant-actions"><button id="runs-refresh" type="button">刷新</button></div></header>
  <section class="assistant-grid"><article class="assistant-panel span-12"><div class="assistant-panel-head"><div><h2>运行记录</h2><p>只显示当前用户在当前 Domain 有权查看的运行。</p></div><div class="assistant-run-types"><span><i class="knowledge"></i> 知识问答</span><span><i class="search"></i> X Search</span><span><i class="image"></i> 文生图</span></div></div><div class="assistant-filter-bar"><div class="assistant-field compact"><label for="run-type">类型</label><select id="run-type"><option>全部类型</option><option>知识问答</option><option>X Search</option><option>文生图</option></select></div><div class="assistant-field compact"><label for="run-status">状态</label><select id="run-status"><option>全部状态</option><option>RUNNING</option><option>COMPLETED</option><option>FAILED</option><option>REJECTED</option></select></div><div class="assistant-field"><label for="run-keyword">Run ID 或请求标识</label><input id="run-keyword" placeholder="不支持按 Prompt 明文跨 Domain 检索"></div><button type="button" id="runs-filter">筛选</button></div><div class="assistant-table-wrap"><table class="assistant-table"><thead><tr><th>Run</th><th>类型</th><th>状态</th><th>模型</th><th>用量摘要</th><th>开始时间</th><th>操作</th></tr></thead><tbody><tr><td colspan="7"><div class="assistant-empty"><div><strong>尚无可显示的运行</strong><p>API 接入后，可在此恢复终态、打开引用或资产详情；不会将供应商原始账单、Secret 或完整 Prompt 直接作为列表字段返回。</p></div></div></td></tr></tbody></table></div></article></section>
</main><script src="../runtime-config.js"></script><script src="./js/assistant-shell.js"></script><script src="./js/assistant-api.js"></script><script src="./js/assistant-management.js"></script></body></html>
