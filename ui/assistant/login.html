<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 智能工作台</title>
  <link rel="stylesheet" href="./css/assistant.css">
</head>
<body class="assistant-login" data-page="login">
  <main class="assistant-main">
    <div class="assistant-login-card">
      <a class="assistant-brand" href="./login.html" aria-label="智能工作台登录">
        <span class="assistant-brand-mark">AS</span>
        <span><strong>Intelligent Desk</strong><small>KBot 4.0</small></span>
      </a>
      <section id="login-section">
        <h1>登录智能工作台</h1>
        <p>使用 assistant_portal 工作域账号登录。首次部署的管理员用户为 assistantadmin。</p>
        <form id="login-form">
          <div class="assistant-field">
            <label for="login-user">用户 ID</label>
            <input id="login-user" name="user_id" value="assistantadmin" required autocomplete="username">
          </div>
          <div class="assistant-field">
            <label for="login-password">密码</label>
            <input id="login-password" name="password" type="password" required autocomplete="current-password">
          </div>
          <p id="login-error" class="assistant-form-error" hidden></p>
          <button class="primary" type="submit">登录</button>
        </form>
      </section>
      <section id="password-section" hidden>
        <h1>修改初始密码</h1>
        <p>当前账号必须先修改密码后才能进入智能工作台。新密码至少 12 位，并同时包含大小写字母、数字和特殊字符。</p>
        <form id="password-form">
          <div class="assistant-field">
            <label for="current-password">当前密码</label>
            <input id="current-password" name="current_password" type="password" required autocomplete="current-password">
          </div>
          <div class="assistant-field">
            <label for="new-password">新密码</label>
            <input id="new-password" name="new_password" type="password" required autocomplete="new-password">
          </div>
          <div class="assistant-field">
            <label for="confirm-password">确认新密码</label>
            <input id="confirm-password" name="confirm_password" type="password" required autocomplete="new-password">
          </div>
          <p id="password-error" class="assistant-form-error" hidden></p>
          <button class="primary" type="submit">保存并进入工作台</button>
        </form>
      </section>
    </div>
  </main>
  <script src="../runtime-config.js"></script>
  <script src="./js/assistant-auth.js"></script>
</body>
</html>
