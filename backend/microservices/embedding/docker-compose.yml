version: '3'

services:
  embedding-service:
    build:
      context: ../../..  # 项目根目录
      dockerfile: backend/microservices/embedding/Dockerfile
    ports:
      - "8000:8000"  # 将容器的8000端口映射到主机的8000端口
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    volumes:
      - ../../../:/app  # 挂载项目根目录到容器的/app目录，便于开发