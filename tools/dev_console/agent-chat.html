<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent 问答测试</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 目标：验证 Agent 配置、Conversation、SSE、Trace、引用和历史重放。 -->
    <header>
      <h1>Agent 问答测试</h1>
      <nav><a href="./index.html">首页</a><a href="./knowledge-core.html">Knowledge Core</a><a href="./agent-debug.html">Run 调试台</a></nav>
    </header>

    <form id="auth-form" class="auth-bar">
      <div class="field"><label>Main API URL</label><input name="baseUrl" required /></div>
      <div class="field"><label>Domain ID</label><input name="domainId" required /></div>
      <div class="field"><label>User ID</label><input name="userId" required /></div>
      <button class="primary" type="submit">保存连接</button>
    </form>

    <main class="grid">
      <section class="panel span-4">
        <h2>Agent 与会话</h2>
        <div class="actions">
          <button id="refresh-agents" class="primary">刷新 Agent</button>
          <button id="refresh-conversations">刷新会话</button>
        </div>
        <div class="field">
          <label>Agent</label>
          <select id="agent-select"></select>
        </div>
        <form id="conversation-form">
          <div class="field"><label>新会话标题（可选）</label><input name="title" /></div>
          <button class="primary" type="submit">创建会话</button>
        </form>
        <div class="field">
          <label>现有会话</label>
          <select id="conversation-select"></select>
        </div>
        <p id="session-status" class="status"></p>
        <pre id="session-output">{}</pre>
      </section>

      <section class="panel span-8">
        <h2>提问</h2>
        <form id="turn-form">
          <div class="field"><label>问题</label><textarea name="input" required placeholder="例如：列出关于数据库性能优化的案例，并给出引用。"></textarea></div>
          <div class="field-row">
            <div class="field"><label>Collection IDs（逗号分隔，可空）</label><input name="collectionIds" /></div>
          </div>
          <div class="field"><label>查询图片（可选，最多 8 张）</label><input name="images" type="file" accept="image/png,image/jpeg,image/webp" multiple /></div>
          <div class="actions">
            <button id="send-turn" class="primary" type="submit">发送并监听 SSE</button>
            <button id="stop-stream" type="button">停止监听</button>
            <button id="load-history" type="button">加载历史</button>
          </div>
        </form>
        <p id="turn-status" class="status"></p>
      </section>

      <section class="panel span-7">
        <h2>会话与最终结果</h2>
        <div id="messages" class="messages"></div>
        <pre id="result-output">{}</pre>
      </section>

      <section class="panel span-5">
        <h2>实时 Agent SSE</h2>
        <p class="hint">按真实前端展示顺序输出公开思考、Skill、检索、回答增量与引用。</p>
        <div id="live-stream" class="agent-stream">
          <p class="muted">发送问题后将在这里显示实时回复。</p>
        </div>
        <details class="raw-sse">
          <summary>查看原始 SSE / Trace</summary>
          <div id="timeline" class="timeline"></div>
        </details>
      </section>
    </main>

    <script src="./shared.js"></script>
    <script src="./agent-chat.js"></script>
  </body>
</html>
