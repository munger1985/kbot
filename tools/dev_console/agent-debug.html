<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Run 调试台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 以 Run 为中心聚合任务、事件、Artifact 与跨服务运行日志。 -->
    <header>
      <h1>Agent Run 调试台</h1>
      <nav>
        <a href="./index.html">首页</a>
        <a href="./agent-chat.html">Agent 问答</a>
        <a href="./operations-logs.html">原始日志</a>
      </nav>
    </header>

    <form id="auth-form" class="auth-bar">
      <div class="field"><label>Main API URL</label><input name="baseUrl" required /></div>
      <div class="field"><label>Domain ID</label><input name="domainId" required /></div>
      <div class="field"><label>User ID</label><input name="userId" required /></div>
      <button class="primary" type="submit">保存连接</button>
    </form>

    <main class="grid debug-console">
      <section class="panel span-4">
        <h2>最近 Run</h2>
        <form id="run-filter-form">
          <div class="field">
            <label>关键字</label>
            <input name="keyword" placeholder="问题、Run ID、状态…" />
          </div>
          <div class="field-row">
            <div class="field">
              <label>状态</label>
              <select name="status">
                <option value="">全部</option>
                <option value="COMPLETED">COMPLETED</option>
                <option value="RUNNING">RUNNING</option>
                <option value="FAILED">FAILED</option>
                <option value="CANCELLED">CANCELLED</option>
              </select>
            </div>
            <div class="field">
              <label>数量</label>
              <select name="limit">
                <option value="25">25</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
              </select>
            </div>
          </div>
          <div class="actions">
            <button class="primary" type="submit">刷新</button>
            <button id="auto-refresh" type="button">自动刷新：关</button>
          </div>
        </form>
        <p id="run-list-status" class="status"></p>
        <div id="run-list" class="run-list"></div>
      </section>

      <section class="panel span-8">
        <h2>Run 概览</h2>
        <div id="run-overview" class="debug-overview">
          <p class="muted">从左侧选择一次 Agent Run。</p>
        </div>
        <h3>执行时间线</h3>
        <div id="run-timeline" class="debug-timeline"></div>
      </section>

      <section class="panel span-12">
        <div class="debug-tabs" role="tablist">
          <button class="active" data-tab="retrieval" type="button">知识检索</button>
          <button data-tab="models" type="button">模型调用</button>
          <button data-tab="tasks" type="button">任务</button>
          <button data-tab="events" type="button">SSE / Events</button>
          <button data-tab="artifacts" type="button">Artifacts</button>
          <button data-tab="logs" type="button">关联日志</button>
          <button data-tab="errors" type="button">错误与重试</button>
        </div>
        <div id="tab-retrieval" class="debug-tab-panel"></div>
        <div id="tab-models" class="debug-tab-panel hidden"></div>
        <div id="tab-tasks" class="debug-tab-panel hidden"></div>
        <div id="tab-events" class="debug-tab-panel hidden"></div>
        <div id="tab-artifacts" class="debug-tab-panel hidden"></div>
        <div id="tab-logs" class="debug-tab-panel hidden"></div>
        <div id="tab-errors" class="debug-tab-panel hidden"></div>
      </section>

      <section class="panel span-12">
        <h2>选中记录详情</h2>
        <pre id="debug-detail">尚未选择记录</pre>
      </section>
    </main>

    <script src="./shared.js"></script>
    <script src="./agent-debug.js"></script>
  </body>
</html>
