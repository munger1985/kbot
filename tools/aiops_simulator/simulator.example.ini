# AIOps数据库流量模拟程序唯一配置
#
# 使用tools/aiops_simulator/manage init-config生成实际配置。
# 实际配置包含数据库密码，必须保持0600且不得提交到Git。

[simulator]
mode = daily
timezone = Asia/Shanghai
historical_year = 2025
summary_interval_seconds = 60
statement_timeout_seconds = 10
retention_days = 30
cleanup_hour = 3
cleanup_batch_size = 1000
random_seed = 20261011

# schedule必须完整覆盖真实一天，值为该时段每秒逻辑业务事务数。
[traffic.oracle]
schedule = 00:00-06:00=0.15, 06:00-08:00=0.50, 08:00-12:00=3.00, 12:00-14:00=1.20, 14:00-18:00=3.50, 18:00-22:00=1.00, 22:00-24:00=0.30
weekend_multiplier = 0.35
max_inflight = 4

[traffic.postgresql]
schedule = 00:00-06:00=0.80, 06:00-08:00=1.50, 08:00-12:00=3.50, 12:00-14:00=2.00, 14:00-18:00=4.00, 18:00-22:00=2.00, 22:00-24:00=1.00
weekend_multiplier = 0.75
max_inflight = 4

[traffic.mysql]
schedule = 00:00-06:00=0.20, 06:00-08:00=1.50, 08:00-12:00=3.00, 12:00-14:00=1.50, 14:00-18:00=4.00, 18:00-22:00=1.50, 22:00-24:00=0.40
weekend_multiplier = 0.50
max_inflight = 4

[database.oracle]
enabled = true
host = 10.0.0.88
port = 1521
service = ORCLPDB1
schema = AIOPS_TEST
username = AIOPS_TEST
password = CHANGE_ME
min_pool_size = 1
max_pool_size = 4

[database.postgresql]
enabled = true
host = 10.0.0.88
port = 5432
database = aiops_demo
schema = mes
username = aiops_test
password = CHANGE_ME
min_pool_size = 1
max_pool_size = 4

[database.mysql]
enabled = true
host = 10.0.0.88
port = 3306
database = aiops_demo
schema = aiops_demo
username = aiops_test
password = CHANGE_ME
min_pool_size = 1
max_pool_size = 4
