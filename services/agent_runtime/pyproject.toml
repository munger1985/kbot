[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbot-agent-runtime"
version = "4.0.0"
description = "KBot 多 Agent 运行时"
requires-python = ">=3.10"
dependencies = [
  "aiohttp==3.13.3",
  "fastapi==0.128.0",
  "fastapi-offline==1.7.6",
  "kbot-platform-clients==4.0.0",
  "kbot-platform-core==4.0.0",
  "Pillow==12.2.0",
  "pydantic==2.12.5",
  "SQLAlchemy==2.0.46",
  "uvicorn==0.49.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_runtime*"]

[tool.setuptools.package-data]
"agent_runtime.specialists.km_asset" = ["resources/*.md"]
