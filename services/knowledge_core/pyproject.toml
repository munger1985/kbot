[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbot-knowledge-core"
version = "4.0.0"
description = "无状态文档解析计算服务；业务 App 自行持久化与检索"
requires-python = ">=3.10"
dependencies = [
  "kbot-knowledge-algorithms==4.0.0",
  "aiohttp==3.13.3",
  "docling==2.114.0",
  "docling-core==2.88.0",
  "fastapi==0.128.0",
  "fastapi-offline==1.7.6",
  "kbot-platform-clients==4.0.0",
  "kbot-platform-core==4.0.0",
  "Pillow==12.2.0",
  "pydantic==2.12.5",
  "uvicorn==0.49.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["knowledge_core*"]
