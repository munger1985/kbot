[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbot-model-serving"
version = "4.0.0"
description = "KBot LLM、Embedding、VLM 与视觉模型托管服务"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.128.0",
  "fastapi-offline==1.7.6",
  "kbot-platform-core==4.0.0",
  "numpy==2.3.5",
  "oci==2.166.0",
  "openai==2.16.0",
  "Pillow==12.2.0",
  "pydantic==2.12.5",
  "SQLAlchemy==2.0.46",
  "torch>=2.6,<3",
  "transformers==5.12.1",
  "uvicorn==0.49.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["model_serving*"]
