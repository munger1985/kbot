[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbot-assistant-app"
version = "4.0.0"
description = "KBot 智能工作台的私有资源编排服务"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.128.0",
  "fastapi-offline==1.7.6",
  "kbot-platform-core==4.0.0",
  "pydantic==2.12.5",
  "SQLAlchemy==2.0.46",
  "uvicorn==0.49.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["assistant_app*"]
